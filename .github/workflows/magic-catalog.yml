name: Magic catalog

on:
  pull_request:
    paths:
      - "MagicCatalogCore/**"
      - "TradingCardScanner/MagicCatalogSeed/**"
      - "TradingCardScanner/Services/MagicCatalog*.swift"
      - "TradingCardScanner/Services/BrowseCatalog.swift"
      - "TradingCardScanner/Services/CardCatalog.swift"
      - "TradingCardScanner/Games/Magic/**"
      - "TradingCardScanner/Views/ScannerViewModel.swift"
      - "TradingCardScanner/App/TradingCardScannerApp.swift"
      - "TradingCardScanner.xcodeproj/project.pbxproj"
      - "Config/**"
      - "magic-publisher/**"
      - "scripts/restore_catalog_hosting_site.sh"
      - "scripts/catalog_hosting_cache.py"
      - "scripts/cloudflare_cache.py"
      - "scripts/r2_catalog_publish.py"
      - "scripts/verify_hosting_cache.py"
      - "scripts/market_price_feeds.py"
      - "scripts/market_price_rollback.py"
      - "scripts/verify_magic_publication_environment.sh"
      - "scripts/tests/test_magic_publication_environment.py"
      - "scripts/tests/test_magic_catalog_workflow.py"
      - "scripts/build_magic_printing_families.py"
      - "scripts/tests/test_magic_printing_families.py"
      - "scripts/verify_pokemon_catalog_hosting_config.sh"
      - "firebase.json"
      - ".github/workflows/magic-catalog.yml"
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the validated candidate"
        required: true
        default: false
        type: boolean
      allow_removal_codes:
        description: "Comma-separated active Magic set codes explicitly authorized for removal"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  MAGIC_CATALOG_PRODUCTION_READ_ORIGIN: https://catalog-staging.scan-stash.com
  FIREBASE_CATALOG_BACKUP_ORIGIN: https://scanstash-catalog-prod.web.app

jobs:
  validate:
    name: Validate Magic core and recorded fixture
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firebase Hosting production configuration
        run: bash scripts/verify_pokemon_catalog_hosting_config.sh
      - name: Test publication environment preflight
        run: python3 -m unittest discover -s scripts/tests -p test_magic_publication_environment.py -v
      - name: Test publication workflow conditions
        run: python3 -m unittest discover -s scripts/tests -p test_magic_catalog_workflow.py -v
      - name: Test printing family derivation
        run: python3 -m unittest discover -s scripts/tests -p test_magic_printing_families.py -v
      - name: Test the macOS core
        run: swift test --package-path MagicCatalogCore
      - name: Build the publisher in release mode
        run: swift build -c release --package-path MagicCatalogCore
      - name: Validate the recorded provider directory
        run: >-
          swift run --package-path MagicCatalogCore magic-catalog-publisher validate
          --input magic-publisher/fixtures/recorded-provider.json
          --revision 1
          --generated-at 2026-01-01T00:00:00Z
          --candidate-root magic-publisher/ci-candidate
          --report magic-publisher/reports/pull-request.json

  prepare-production:
    name: Prepare and validate Magic production candidate
    needs: validate
    outputs:
      has_changes: ${{ steps.prepare.outputs.has_changes }}
      requires_approval: ${{ steps.prepare.outputs.requires_approval }}
      publish_environment: ${{ steps.prepare.outputs.publish_environment }}
      change_class: ${{ steps.prepare.outputs.change_class }}
      candidate_manifest_sha256: ${{ steps.candidate_manifest.outputs.sha256 }}
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Read the active Magic production pointer
        run: |
          active_path="${RUNNER_TEMP}/magic-catalog-production-current.json"
          if ! status="$(curl --compressed --location --proto '=https' --tlsv1.2 --max-redirs 3 --silent --show-error \
            --header 'Cache-Control: no-cache' \
            "${MAGIC_CATALOG_PRODUCTION_READ_ORIGIN}/magic/v1/current.json?r2v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$active_path" \
            --write-out '%{http_code}')"; then
            echo "Failed to read the active Magic production pointer" >&2
            exit 1
          fi
          case "$status" in
            200)
              echo "Active Magic production release downloaded to $active_path"
              ;;
            404)
              echo "No active Magic production release is available; preparing initial publication"
              rm -f "$active_path"
              ;;
            *)
              echo "Unexpected HTTP $status while reading the active Magic production pointer" >&2
              exit 1
              ;;
          esac
      - name: Validate the live Magic production candidate
        run: |
          active_path="${RUNNER_TEMP}/magic-catalog-production-current.json"
          active_args=()
          if [ -f "$active_path" ]; then
            active_args+=(--active-release "$active_path")
          fi
          removal_args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ -n "${{ inputs.allow_removal_codes }}" ]; then
            removal_args+=(--allow-removal-codes "${{ inputs.allow_removal_codes }}")
          fi
          swift run --package-path MagicCatalogCore magic-catalog-publisher validate \
            --live true \
            --trusted-keys-file Config/MagicCatalogProduction.xcconfig \
            --candidate-root magic-publisher/candidate \
            --report magic-publisher/reports/production.json \
            "${active_args[@]}" \
            "${removal_args[@]}"
      - name: Create the candidate SHA-256 manifest
        id: candidate_manifest
        run: |
          (
            cd magic-publisher
            shasum -a 256 \
              candidate/catalog-payload.json \
              candidate/review-report.json \
              reports/production.json \
              > reports/production-manifest.sha256
          )
          manifest_sha256="$(shasum -a 256 magic-publisher/reports/production-manifest.sha256 | awk '{print $1}')"
          echo "sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
      - name: Classify the production candidate
        id: prepare
        run: |
          change_class="$(jq -r '.changeClass // "unknown"' magic-publisher/reports/production.json)"
          case "$change_class" in
            none)
              has_changes="false"
              requires_approval="false"
              publish_environment=""
              ;;
            contentOnly)
              has_changes="true"
              requires_approval="false"
              publish_environment="magic-catalog-production-auto"
              ;;
            authority|newSet|unknown)
              has_changes="true"
              requires_approval="true"
              publish_environment="magic-catalog-production"
              ;;
            *)
              echo "Unknown Magic catalog change class: $change_class" >&2
              exit 1
              ;;
          esac

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "requires_approval=$requires_approval" >> "$GITHUB_OUTPUT"
          echo "publish_environment=$publish_environment" >> "$GITHUB_OUTPUT"
          echo "change_class=$change_class" >> "$GITHUB_OUTPUT"
          echo "Magic catalog candidate changes: $has_changes"
          echo "Magic catalog change class: $change_class"
          echo "Magic catalog approval required: $requires_approval"
          echo "Magic catalog publish environment: $publish_environment"
          {
            echo "## Magic catalog production candidate"
            jq -r '
              "- Revision: \(.revision)",
              "- Descriptor count: \(.descriptorCount)",
              "- Change class: \(.changeClass)",
              "- Added: \(.addedCodes | if length == 0 then "none" else join(", ") end)",
              "- Content: \(.contentChangedCodes | if length == 0 then "none" else join(", ") end)",
              "- Authority: \(.authorityChangedCodes | if length == 0 then "none" else join(", ") end)",
              "- Removed: \(.removedCodes | if length == 0 then "none" else join(", ") end)",
              "- Scanner projection changes: \(.scannerProjectionChangedCodes | if length == 0 then "none" else join(", ") end)",
              "- Browse projection changes: \(.browseProjectionChangedCodes | if length == 0 then "none" else join(", ") end)",
              "- Routing projection changes: \(.routingProjectionChangedCodes | if length == 0 then "none" else join(", ") end)",
              "- Warnings: \(.warnings | length)"' \
              magic-publisher/reports/production.json
            echo "- Approval required: $requires_approval"
            echo "- Publish environment: $publish_environment"
            if [ "${{ github.event_name }}" = "schedule" ] && [ "$requires_approval" = "true" ]; then
              echo "- Manual publication is required; the validated candidate is retained as an artifact. Run this workflow with publish enabled to revalidate the live catalog and request production approval."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$requires_approval" = "true" ]; then
            echo "::warning title=Magic catalog needs manual publication::The $change_class candidate was not published. Run this workflow with publish enabled to revalidate and request production approval."
          fi
      - name: Upload the validated production candidate
        uses: actions/upload-artifact@v4
        with:
          name: magic-catalog-production-candidate-${{ github.run_id }}
          path: |
            magic-publisher/candidate
            magic-publisher/reports/production.json
            magic-publisher/reports/production-manifest.sha256
          if-no-files-found: error
          retention-days: 7

  publish-production:
    name: Sign and stage Magic production catalog
    needs: prepare-production
    if: >-
      needs.prepare-production.outputs.has_changes == 'true' &&
      ((github.event_name == 'schedule' &&
        needs.prepare-production.outputs.requires_approval == 'false' &&
        needs.prepare-production.outputs.change_class == 'contentOnly') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: macos-15
    environment:
      name: ${{ needs.prepare-production.outputs.publish_environment }}
    outputs:
      catalog_artifact: ${{ steps.share-catalog.outputs.artifact-id }}
      revision: ${{ steps.stage.outputs.revision }}
    env:
      GITHUB_ENVIRONMENT: ${{ needs.prepare-production.outputs.publish_environment }}
      MAGIC_CATALOG_PUBLISH: "true"
      MAGIC_CATALOG_SIGNING_KEY: ${{ secrets.MAGIC_CATALOG_SIGNING_KEY }}
      MAGIC_CATALOG_KEY_ID: ${{ secrets.MAGIC_CATALOG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check required Magic signing configuration
        run: bash scripts/verify_magic_publication_environment.sh --signing-only
      - name: Download the validated production candidate
        uses: actions/download-artifact@v4
        with:
          name: magic-catalog-production-candidate-${{ github.run_id }}
          path: magic-publisher
      - name: Verify downloaded production candidate
        run: |
          test -f magic-publisher/candidate/catalog-payload.json
          test -f magic-publisher/candidate/review-report.json
          test -f magic-publisher/reports/production.json
          test -f magic-publisher/reports/production-manifest.sha256
          expected_manifest_sha256="${{ needs.prepare-production.outputs.candidate_manifest_sha256 }}"
          actual_manifest_sha256="$(shasum -a 256 magic-publisher/reports/production-manifest.sha256 | awk '{print $1}')"
          test "$actual_manifest_sha256" = "$expected_manifest_sha256"
          (
            cd magic-publisher
            shasum -a 256 -c reports/production-manifest.sha256
          )
      - name: Read the active R2 Magic production pointer
        run: |
          active_path="${RUNNER_TEMP}/magic-catalog-production-current.json"
          if ! status="$(curl --compressed --location --proto '=https' --tlsv1.2 --max-redirs 3 --silent --show-error \
            --header 'Cache-Control: no-cache' \
            "${MAGIC_CATALOG_PRODUCTION_READ_ORIGIN}/magic/v1/current.json?r2v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$active_path" \
            --write-out '%{http_code}')"; then
            echo "Failed to read the active Magic production pointer" >&2
            exit 1
          fi
          case "$status" in
            200) ;;
            404) rm -f "$active_path" ;;
            *) echo "Unexpected HTTP $status while reading the active Magic production pointer" >&2; exit 1 ;;
          esac
      - name: Sign and stage the immutable Magic revision and pointer for R2
        id: stage
        run: |
          active_path="${RUNNER_TEMP}/magic-catalog-production-current.json"
          active_args=()
          metadata_args=()
          if [ -f "$active_path" ]; then
            previous_revision="$(swift run --package-path MagicCatalogCore magic-catalog-publisher verify-release \
              --path "$active_path" --environment production \
              --trusted-keys-file Config/MagicCatalogProduction.xcconfig)"
            active_args+=(--active-release "$active_path")
            metadata_args+=(--previous-revision "$previous_revision" --previous-pointer "$active_path")
          fi
          rm -rf magic-publisher/r2-catalog-candidate
          mkdir -p magic-publisher/r2-catalog-candidate/site
          swift run --package-path MagicCatalogCore magic-catalog-publisher publish \
            --candidate-root magic-publisher/candidate \
            --site-root magic-publisher/r2-catalog-candidate/site \
            --environment production \
            --change-class "${{ needs.prepare-production.outputs.change_class }}" \
            --trusted-keys-file Config/MagicCatalogProduction.xcconfig \
            --report magic-publisher/reports/production.json \
            "${active_args[@]}"
          revision="$(jq -er .revision magic-publisher/candidate/catalog-payload.json)"
          for artifact in catalog-payload.json review-report.json; do
            cmp "magic-publisher/candidate/$artifact" "magic-publisher/r2-catalog-candidate/site/magic/v1/releases/$revision/$artifact"
          done
          swift run --skip-build --package-path MagicCatalogCore magic-catalog-publisher verify-release \
            --path "magic-publisher/r2-catalog-candidate/site/magic/v1/current.json" --environment production \
            --trusted-keys-file Config/MagicCatalogProduction.xcconfig --expected-revision "$revision" >/dev/null
          python3 scripts/r2_catalog_publish.py \
            --site magic-publisher/r2-catalog-candidate/site \
            --write-catalog-metadata magic-publisher/r2-catalog-candidate/catalog-publish-metadata.json \
            --namespace magic/v1 --revision "$revision" "${metadata_args[@]}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Retain the production review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-catalog-production-report-${{ github.run_id }}
          path: magic-publisher/reports/production.json
          if-no-files-found: warn
          retention-days: 90
      - name: Hand off the verified Magic release to R2
        id: share-catalog
        uses: actions/upload-artifact@v4
        with:
          name: magic-r2-catalog-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: magic-publisher/r2-catalog-candidate
          if-no-files-found: error
          retention-days: 7

  publish-r2-catalog:
    name: Publish and verify primary R2 Magic catalog
    needs: publish-production
    if: ${{ !cancelled() && needs.publish-production.result == 'success' && needs.publish-production.outputs.catalog_artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: r2-catalog-production
    concurrency:
      group: scanstash-catalog-r2-hosting
      cancel-in-progress: false
      queue: max
    outputs:
      origin_verified: ${{ steps.publish.outputs.origin_verified }}
      cache_verified: ${{ steps.publish.outputs.cache_verified }}
      inventory_artifact: ${{ steps.share-inventory.outputs.artifact-id }}
    steps:
      - name: Require the staged Magic artifact
        env:
          ARTIFACT_ID: ${{ needs.publish-production.outputs.catalog_artifact }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo 'The staged Magic catalog artifact could not be handed off to R2.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-production.outputs.catalog_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/magic-r2-catalog
      - name: Publish immutable release, activate pointer and verify Cloudflare cache
        id: publish
        env:
          PYTHONUNBUFFERED: "1"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_CACHE_ENFORCE: ${{ vars.CLOUDFLARE_CACHE_ENFORCE }}
          REVISION: ${{ needs.publish-production.outputs.revision }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in r2-catalog-production}"
          : "${AWS_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in r2-catalog-production}"
          set +e
          python3 scripts/r2_catalog_publish.py \
            --primary-catalog magic/v1 \
            --catalog-metadata "$RUNNER_TEMP/magic-r2-catalog/catalog-publish-metadata.json" \
            --site "$RUNNER_TEMP/magic-r2-catalog/site" \
            --public-base "${MAGIC_CATALOG_PRODUCTION_READ_ORIGIN}" \
            --cache-report "$RUNNER_TEMP/magic-cache-verification.json" \
            --verify-all
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 2 ]]; then
            exit "$rc"
          fi
          echo "origin_verified=true" >> "$GITHUB_OUTPUT"
          cache_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cacheStatus"])' "$RUNNER_TEMP/magic-cache-verification.json")"
          echo "cache_verified=$cache_status" >> "$GITHUB_OUTPUT"
          echo "Origin verification (nonce-based) passed for Magic revision $REVISION on R2. Client-visible cache verification: $cache_status. Firebase backup reports separately." >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory R2 price builds for Firebase backup
        id: inventory
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          : "${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in r2-catalog-production}"
          list_r2=(aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            --cli-connect-timeout 10 --cli-read-timeout 60 --no-cli-pager --output json
            s3api list-objects-v2 --bucket "$R2_BUCKET_NAME")
          "${list_r2[@]}" --prefix market-prices/v2/verified-builds/ --query 'Contents[].Key' \
            > "$RUNNER_TEMP/r2-verified-builds.json"
          "${list_r2[@]}" --prefix market-prices/v2/builds/ --delimiter / --query 'CommonPrefixes[].Prefix' \
            > "$RUNNER_TEMP/r2-legacy-inventory.json"
      - name: Share R2 price inventory for Firebase backup
        if: steps.inventory.outcome == 'success'
        id: share-inventory
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: magic-r2-price-builds-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r2-verified-builds.json
            ${{ runner.temp }}/r2-legacy-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce client-visible cache verification status
        if: steps.publish.outputs.cache_verified != 'passed'
        env:
          CACHE_STATUS: ${{ steps.publish.outputs.cache_verified }}
        run: |
          if [[ "$CACHE_STATUS" == "failed" ]]; then
            echo '::error title=Cloudflare cache verification failed::Magic R2 origin publication is active, but purge or canonical verification failed. Not eligible for Stage 2 cutover readiness until recovered.'
            exit 1
          fi
          echo '::warning title=Cloudflare cache verification skipped::Configure CLOUDFLARE_ZONE_ID and CLOUDFLARE_CACHE_PURGE_TOKEN in r2-catalog-production for Stage 2 cache readiness.'

  backup-firebase-catalog:
    name: Back up verified R2 site to Firebase
    needs: [publish-production, publish-r2-catalog]
    if: ${{ !cancelled() && needs.publish-r2-catalog.outputs.origin_verified == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    environment: pokemon-catalog-production
    concurrency:
      group: scanstash-catalog-production-hosting
      cancel-in-progress: false
      queue: max
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE_ID: ${{ secrets.FIREBASE_HOSTING_SITE_ID }}
      REVISION: ${{ needs.publish-production.outputs.revision }}
    steps:
      - name: Require the R2 price build inventory
        env:
          INVENTORY_ARTIFACT: ${{ needs.publish-r2-catalog.outputs.inventory_artifact }}
        run: |
          if [[ ! "$INVENTORY_ARTIFACT" =~ ^[0-9]+$ ]]; then
            echo '::error title=Firebase catalog backup::The R2 price build inventory is unavailable.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/r2-catalog-cache
          key: r2-catalog-restore-v1-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-catalog-restore-v1-
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-r2-catalog.outputs.inventory_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/r2-price-inventory
      - name: Restore the complete verified site from R2
        env:
          PREFER_R2_PRICE_HISTORY: "true"
        run: |
          export CATALOG_RESTORE_CACHE_WORK="$RUNNER_TEMP/r2-catalog-pointers"
          python3 scripts/catalog_hosting_cache.py prepare --origin "${MAGIC_CATALOG_PRODUCTION_READ_ORIGIN}" \
            --site publisher/site --cache "$RUNNER_TEMP/r2-catalog-cache" --work "$CATALOG_RESTORE_CACHE_WORK"
          bash scripts/restore_catalog_hosting_site.sh \
            "$CATALOG_RESTORE_CACHE_WORK/pokemon-current.json" \
            "$CATALOG_RESTORE_CACHE_WORK/magic-current.json" publisher/site \
            "${MAGIC_CATALOG_PRODUCTION_READ_ORIGIN}" \
            PokemonCatalogCore Config/PokemonCatalogProduction.xcconfig \
            MagicCatalogCore Config/MagicCatalogProduction.xcconfig \
            "$CATALOG_RESTORE_CACHE_WORK/one-piece-current.json" \
            OnePieceCatalogCore Config/OnePieceCatalogProduction.xcconfig \
            "$CATALOG_RESTORE_CACHE_WORK/yugioh-current.json"
          test -f "publisher/site/magic/v1/releases/$REVISION/catalog-release.json"
          bash scripts/verify_pokemon_catalog_hosting_config.sh
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.35.1
      - name: Confirm R2 parity and deploy Firebase backup
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_HOSTING_SITE_ID"
          service_account_file="${RUNNER_TEMP}/firebase-production-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          firebase target:apply hosting production "$FIREBASE_HOSTING_SITE_ID" \
            --project "$FIREBASE_PROJECT_ID"
          python3 scripts/catalog_hosting_cache.py confirm --origin "${MAGIC_CATALOG_PRODUCTION_READ_ORIGIN}" \
            --site publisher/site --work "$RUNNER_TEMP/r2-catalog-pointers"
          python3 scripts/catalog_hosting_cache.py confirm-r2-scopes --site publisher/site
          inventory="$RUNNER_TEMP/r2-price-inventory/r2-verified-builds.json"
          if [[ ! -f publisher/site/market-prices/v2/history.json ]]; then
            inventory="$RUNNER_TEMP/r2-price-inventory/r2-legacy-inventory.json"
          fi
          python3 -u scripts/market_price_rollback.py sync-r2 --site-root publisher/site --r2-inventory "$inventory" \
            --state-file "$RUNNER_TEMP/firebase-v2-deploy-state.json"
          firebase deploy --only hosting:production \
            --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Verify Firebase backup readback and R2 parity
        run: |
          service_account_file="$(mktemp "$RUNNER_TEMP/firebase-verify-sa.XXXXXX")"
          trap 'rm -f "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          python3 scripts/catalog_hosting_cache.py verify-firebase-catalogs \
            --site publisher/site --namespace magic/v1 --revision "$REVISION"
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import NAMESPACE, restore
          destination = Path('publisher/price-readback')
          assert restore(destination, require_fresh=False, require_present=True)
          expected = Path('publisher/site') / NAMESPACE / 'index.json'
          assert (destination / NAMESPACE / 'index.json').read_bytes() == expected.read_bytes()
          PY
          python3 -u scripts/market_price_rollback.py verify --site-root publisher/site \
            --state-file "$RUNNER_TEMP/firebase-v2-deploy-state.json" \
            --firebase-site "$FIREBASE_HOSTING_SITE_ID" \
            --service-account "$service_account_file"
          python3 scripts/market_price_rollback.py confirm-primary --site-root publisher/site
          python3 scripts/catalog_hosting_cache.py confirm --origin "${MAGIC_CATALOG_PRODUCTION_READ_ORIGIN}" \
            --site publisher/site --work "$RUNNER_TEMP/r2-catalog-pointers"
          echo "Verified Firebase backup for Magic revision $REVISION against $FIREBASE_CATALOG_BACKUP_ORIGIN." >> "$GITHUB_STEP_SUMMARY"
      - name: Seal the verified R2 catalog cache
        id: catalog-cache
        continue-on-error: true
        run: |
          key=$(python3 scripts/catalog_hosting_cache.py seal --site publisher/site \
            --cache "$RUNNER_TEMP/r2-catalog-cache" --work "$RUNNER_TEMP/r2-catalog-pointers")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.catalog-cache.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/r2-catalog-cache
          key: r2-catalog-restore-v1-${{ steps.catalog-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify continuous rollback readiness and report status
        env:
          FIREBASE_QUOTA_MODE: ${{ vars.FIREBASE_QUOTA_MODE }}
          FIREBASE_STORAGE_LIMIT_BYTES: ${{ vars.FIREBASE_STORAGE_LIMIT_BYTES }}
          FIREBASE_DAILY_BANDWIDTH_LIMIT_BYTES: ${{ vars.FIREBASE_DAILY_BANDWIDTH_LIMIT_BYTES }}
          FIREBASE_MONTHLY_BANDWIDTH_LIMIT_BYTES: ${{ vars.FIREBASE_MONTHLY_BANDWIDTH_LIMIT_BYTES }}
          FIREBASE_STAGED_SITE_LIMIT_BYTES: ${{ vars.FIREBASE_STAGED_SITE_LIMIT_BYTES }}
          FIREBASE_MIN_HEADROOM_RATIO: ${{ vars.FIREBASE_MIN_HEADROOM_RATIO }}
        run: |
          service_account_file="$(mktemp "$RUNNER_TEMP/firebase-readiness-sa.XXXXXX")"
          trap 'rm -f "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          python3 scripts/rollback_readiness.py \
            --r2-origin "${MAGIC_CATALOG_PRODUCTION_READ_ORIGIN}" \
            --firebase-origin "${FIREBASE_CATALOG_BACKUP_ORIGIN}" \
            --rollback-hostname catalog.scan-stash.com \
            --site-root publisher/site \
            --firebase-project "$FIREBASE_PROJECT_ID" \
            --firebase-site "$FIREBASE_HOSTING_SITE_ID" \
            --service-account "$service_account_file" \
            --quota-mode "${FIREBASE_QUOTA_MODE:-advisory}" \
            --report "$RUNNER_TEMP/rollback-readiness.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload rollback readiness report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: magic-rollback-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-readiness.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Report a failed backup separately from the primary publication
        if: failure()
        run: |
          echo '::warning title=Firebase Magic catalog backup failed::Rollback target marked NOT READY. The verified R2 catalog publication remains active.'
          echo '**Rollback readiness: NOT READY** — Firebase backup failed. The verified R2 Magic catalog publication remains active.' >> "$GITHUB_STEP_SUMMARY"
