name: Market price feed contracts
on:
  pull_request:
    paths:
      - "scripts/market_price_feeds.py"
      - "scripts/tests/test_market_price_feeds.py"
      - "publisher/pokemon-battle-deck-finishes.json"
      - "publisher/pokemon-deck-exclusive-normals.json"
      - "publisher/pokemon-mcdonalds-2026.json"
      - "publisher/pokemon-delta-reign-printings.json"
      - "publisher/pokemon-prize-pack-printings.json"
      - "scripts/restore_catalog_hosting_site.sh"
      - "scripts/tests/test_catalog_hosting_restore.py"
      - "scripts/catalog_hosting_cache.py"
      - "scripts/tests/test_catalog_hosting_cache.py"
      - "scripts/r2_catalog_publish.py"
      - "scripts/market_price_v2.py"
      - "scripts/market_price_rollback.py"
      - "scripts/tests/test_market_price_rollback.py"
      - "scripts/publish_one_piece_local.py"
      - "scripts/catalog_parity.py"
      - "scripts/tests/test_r2_catalog_publish.py"
      - ".github/workflows/yugioh-catalog.yml"
      - ".github/workflows/market-price-feed-tests.yml"
      - "firebase.json"
  push:
    paths:
      - "scripts/market_price_feeds.py"
      - "scripts/tests/test_market_price_feeds.py"
      - "publisher/pokemon-battle-deck-finishes.json"
      - "publisher/pokemon-deck-exclusive-normals.json"
      - "publisher/pokemon-mcdonalds-2026.json"
      - "publisher/pokemon-delta-reign-printings.json"
      - "publisher/pokemon-prize-pack-printings.json"
      - "scripts/restore_catalog_hosting_site.sh"
      - "scripts/tests/test_catalog_hosting_restore.py"
      - "scripts/catalog_hosting_cache.py"
      - "scripts/tests/test_catalog_hosting_cache.py"
      - "scripts/r2_catalog_publish.py"
      - "scripts/market_price_v2.py"
      - "scripts/market_price_rollback.py"
      - "scripts/tests/test_market_price_rollback.py"
      - "scripts/publish_one_piece_local.py"
      - "scripts/catalog_parity.py"
      - "scripts/tests/test_r2_catalog_publish.py"
      - ".github/workflows/yugioh-catalog.yml"
      - ".github/workflows/market-price-feed-tests.yml"
      - "firebase.json"
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_market_price_feeds.py'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_catalog_hosting_restore.py'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_catalog_hosting_cache.py'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_r2_catalog_publish.py'
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_market_price_rollback.py'
      - run: bash scripts/verify_pokemon_catalog_hosting_config.sh
