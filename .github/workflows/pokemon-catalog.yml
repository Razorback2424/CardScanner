name: Pokémon catalog

on:
  pull_request:
    paths:
      - "PokemonCatalogCore/**"
      - "MagicCatalogCore/**"
      - "TradingCardScanner/**"
      - "TradingCardScannerTests/PokemonCatalog*.swift"
      - "TradingCardScanner.xcodeproj/project.pbxproj"
      - "Config/**"
      - "publisher/**"
      - "publisher/discovery-policy.json"
      - "scripts/restore_pokemon_catalog_releases.sh"
      - "scripts/restore_catalog_hosting_site.sh"
      - "scripts/verify_pokemon_catalog_hosting_config.sh"
      - "firebase.json"
      - ".firebaserc.example"
      - ".github/workflows/pokemon-catalog.yml"
  push:
    paths:
      - "PokemonCatalogCore/**"
      - "MagicCatalogCore/**"
      - "TradingCardScanner/**"
      - "TradingCardScannerTests/PokemonCatalog*.swift"
      - "TradingCardScanner.xcodeproj/project.pbxproj"
      - "Config/**"
      - "publisher/**"
      - "publisher/discovery-policy.json"
      - "scripts/restore_pokemon_catalog_releases.sh"
      - "scripts/restore_catalog_hosting_site.sh"
      - "scripts/verify_pokemon_catalog_hosting_config.sh"
      - "firebase.json"
      - ".firebaserc.example"
      - ".github/workflows/pokemon-catalog.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a previously validated candidate"
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: "Workflow run containing the reviewed candidate"
        required: false
        type: string
      candidate_manifest_sha256:
        description: "Reviewed candidate manifest SHA-256"
        required: false
        type: string
      bootstrap:
        description: "Allow initial publication when no production pointer exists"
        default: false
        type: boolean
permissions:
  contents: read

env:
  POKEMON_CATALOG_PRODUCTION_READ_ORIGIN: https://scanstash-catalog-prod.web.app

jobs:
  validate:
    name: Validate core and recorded fixture
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firebase Hosting production configuration
        run: bash scripts/verify_pokemon_catalog_hosting_config.sh
      - name: Test the macOS core
        run: swift test --package-path PokemonCatalogCore
      - name: Build the publisher in release mode
        run: swift build -c release --package-path PokemonCatalogCore
      - name: Validate the recorded publication input
        run: >-
          swift run --package-path PokemonCatalogCore pokemon-catalog-publisher validate
          --fixture-dir publisher/fixtures
          --generated-at 2026-01-01T00:00:00Z
          --report publisher/reports/pull-request.json

  prepare-production:
    name: Prepare and validate production candidate
    needs: validate
    outputs:
      has_changes: ${{ steps.prepare.outputs.has_changes }}
      requires_approval: ${{ steps.prepare.outputs.requires_approval }}
      candidate_manifest_sha256: ${{ steps.candidate_manifest.outputs.sha256 }}
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == false)
    concurrency:
      group: scanstash-catalog-production-hosting
      cancel-in-progress: false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Read the active production pointer
        run: |
          active_path="${RUNNER_TEMP}/pokemon-catalog-production-current.json"
          if ! status="$(curl --location --proto '=https' --tlsv1.2 --max-redirs 3 --silent --show-error \
            "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}/v1/current.json" \
            --output "$active_path" \
            --write-out '%{http_code}')"; then
            echo "Failed to read the active production pointer" >&2
            exit 1
          fi
          case "$status" in
            200)
              echo "Active production release downloaded to $active_path"
              ;;
            404)
              if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.bootstrap }}" != "true" ]; then
                echo "::error::Production pointer v1/current.json is missing; refusing implicit re-baseline. Restore the last verified release, or dispatch with bootstrap=true." >&2
                exit 1
              fi
              echo "Explicit bootstrap: preparing initial publication"
              rm -f "$active_path"
              ;;
            *)
              echo "Unexpected HTTP $status while reading the active production pointer" >&2
              exit 1
              ;;
          esac
      - name: Validate the scoped live production candidate
        run: |
          swift run --package-path PokemonCatalogCore pokemon-catalog-publisher validate \
            --input publisher/catalog-input.json \
            --discovery-policy publisher/discovery-policy.json \
            --active-release "${RUNNER_TEMP}/pokemon-catalog-production-current.json" \
            --environment production \
            --live true \
            --candidate-root publisher/candidate \
            --report publisher/reports/production.json
      - name: Classify the production candidate
        id: prepare
        run: |
          change_class="$(jq -r '.changeClass // "unknown"' publisher/reports/production.json)"
          case "$change_class" in
            none)
              has_changes="false"
              requires_approval="false"
              ;;
            contentOnly)
              has_changes="true"
              requires_approval="false"
              ;;
            baselineMigration|authority|newSet)
              has_changes="true"
              requires_approval="true"
              ;;
            unknown)
              echo "Unknown catalog change class: $change_class" >&2
              exit 1
              ;;
            *)
              echo "Unknown catalog change class: $change_class" >&2
              exit 1
              ;;
          esac

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "requires_approval=$requires_approval" >> "$GITHUB_OUTPUT"
          echo "Catalog candidate changes: $has_changes"
          echo "Catalog change class: $change_class"
          echo "Catalog authority approval required: $requires_approval"
          {
            echo "## Pokémon catalog production candidate"
            jq -r '"- Revision: \(.revision)", "- Change class: \(.changeClass)", "- Added: \(.addedProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Content: \(.contentChangedProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Authority: \(.authorityChangedProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Baseline: \(.baselineFingerprintProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Excluded: \(.excludedProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Secondary provider available: \(.secondaryProviderAvailable)", "- Ambiguous secondary matches: \(.ambiguousSecondaryMatches | if length == 0 then "none" else join(", ") end)"' \
              publisher/reports/production.json
            echo "- Approval required: $requires_approval"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the candidate SHA-256 manifest
        id: candidate_manifest
        run: |
          (
            cd publisher
            shasum -a 256 \
              candidate/catalog-payload.json \
              candidate/pokemon-catalog-snapshot.json \
              candidate/review-report.json \
              reports/production.json \
              > reports/production-manifest.sha256
          )
          manifest_sha256="$(shasum -a 256 publisher/reports/production-manifest.sha256 | awk '{print $1}')"
          echo "sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "- Candidate run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate manifest SHA-256: $manifest_sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the validated production candidate
        id: upload-candidate
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-catalog-production-candidate-${{ github.run_id }}
          path: |
            publisher/candidate
            publisher/reports/production.json
            publisher/reports/production-manifest.sha256
          if-no-files-found: error
          retention-days: 7

  publish-production:
    name: Publish production catalog
    needs: [validate, prepare-production]
    if: >-
      (!cancelled() && needs.validate.result == 'success' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && needs.prepare-production.result == 'success' &&
        needs.prepare-production.outputs.has_changes == 'true' && needs.prepare-production.outputs.requires_approval == 'false') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true)))
    concurrency:
      group: scanstash-catalog-production-hosting
      cancel-in-progress: false
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    environment: pokemon-catalog-production
    env:
      GITHUB_ENVIRONMENT: pokemon-catalog-production
      POKEMON_CATALOG_PUBLISH: "true"
      POKEMON_CATALOG_SIGNING_KEY: ${{ secrets.POKEMON_CATALOG_SIGNING_KEY }}
      POKEMON_CATALOG_KEY_ID: ${{ secrets.POKEMON_CATALOG_KEY_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE_ID: ${{ secrets.FIREBASE_HOSTING_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the production candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN_ID: ${{ inputs.candidate_run_id }}
          REVIEWED_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          PREPARED_MANIFEST_SHA256: ${{ needs.prepare-production.outputs.candidate_manifest_sha256 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            candidate_run="$REVIEWED_RUN_ID"
            candidate_sha="$REVIEWED_MANIFEST_SHA256"
            if ! [[ "$candidate_run" =~ ^[1-9][0-9]*$ && "$candidate_sha" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Supply the reviewed run ID and manifest SHA-256 from a candidate preparation run."
              exit 1
            fi
            workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pokemon-catalog.yml" --jq .id)"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run" |
              jq -e --argjson workflow "$workflow_id" --arg repository "$GITHUB_REPOSITORY" '
                .workflow_id == $workflow and .head_repository.full_name == $repository and
                .head_branch == "main" and .conclusion == "success" and
                (.event == "schedule" or .event == "workflow_dispatch")' > /dev/null
          else
            candidate_run="$GITHUB_RUN_ID"
            candidate_sha="$PREPARED_MANIFEST_SHA256"
          fi
          echo "run_id=$candidate_run" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Download the validated production candidate
        uses: actions/download-artifact@v4
        with:
          name: pokemon-catalog-production-candidate-${{ steps.candidate.outputs.run_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: publisher
      - name: Verify downloaded production candidate
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.candidate.outputs.manifest_sha256 }}
        run: |
          test -f publisher/candidate/catalog-payload.json
          test -f publisher/candidate/pokemon-catalog-snapshot.json
          test -f publisher/candidate/review-report.json
          test -f publisher/reports/production.json
          test -f publisher/reports/production-manifest.sha256
          actual_manifest_sha256="$(shasum -a 256 publisher/reports/production-manifest.sha256 | awk '{print $1}')"
          test "$actual_manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          (
            cd publisher
            shasum -a 256 -c reports/production-manifest.sha256
          )
      - name: Read the active production pointer
        run: |
          active_path="${RUNNER_TEMP}/pokemon-catalog-production-current.json"
          if ! status="$(curl --location --proto '=https' --tlsv1.2 --max-redirs 3 --silent --show-error \
            "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}/v1/current.json" \
            --output "$active_path" \
            --write-out '%{http_code}')"; then
            echo "Failed to read the active production pointer" >&2
            exit 1
          fi
          case "$status" in
            200)
              echo "Active production release downloaded to $active_path"
              ;;
            404)
              if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.bootstrap }}" != "true" ]; then
                echo "::error::Production pointer v1/current.json is missing; refusing implicit re-baseline. Restore the last verified release, or dispatch with bootstrap=true." >&2
                exit 1
              fi
              echo "Explicit bootstrap: preparing initial publication"
              rm -f "$active_path"
              ;;
            *)
              echo "Unexpected HTTP $status while reading the active production pointer" >&2
              exit 1
              ;;
          esac
      - name: Recheck the candidate against the active production release
        run: |
          swift run --package-path PokemonCatalogCore pokemon-catalog-publisher verify-candidate \
            --candidate-root publisher/candidate --environment production \
            --active-release "${RUNNER_TEMP}/pokemon-catalog-production-current.json"
      - name: Read the active Magic production pointer
        run: |
          active_path="${RUNNER_TEMP}/magic-catalog-production-current.json"
          if ! status="$(curl --location --proto '=https' --tlsv1.2 --max-redirs 3 --silent --show-error \
            "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}/magic/v1/current.json" \
            --output "$active_path" \
            --write-out '%{http_code}')"; then
            echo "Failed to read the active Magic production pointer" >&2
            exit 1
          fi
          case "$status" in
            200)
              echo "Active Magic production release downloaded to $active_path"
              ;;
            404)
              echo "No active Magic production release is available; treating this as initial publication"
              rm -f "$active_path"
              ;;
            *)
              echo "Unexpected HTTP $status while reading the active Magic production pointer" >&2
              exit 1
              ;;
          esac
      - name: Restore previously published production revision objects
        run: |
          restore_args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bootstrap }}" = "true" ]; then
            restore_args+=(--bootstrap-pokemon)
          fi
          bash scripts/restore_catalog_hosting_site.sh "${restore_args[@]}" \
            "${RUNNER_TEMP}/pokemon-catalog-production-current.json" \
            "${RUNNER_TEMP}/magic-catalog-production-current.json" \
            publisher/site "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}"
      - name: Publish the immutable production revision and current pointer
        run: |
          active_path="${RUNNER_TEMP}/pokemon-catalog-production-current.json"
          active_args=()
          if [ -f "$active_path" ]; then
            active_args+=(--active-release "$active_path")
          fi
          change_class="$(jq -er .changeClass publisher/candidate/review-report.json)"
          case "$change_class" in
            contentOnly) ;;
            baselineMigration|authority|newSet) test "$GITHUB_EVENT_NAME" = "workflow_dispatch" ;;
            *) echo "::error::Catalog change class is ineligible for publication"; exit 1 ;;
          esac
          swift run --package-path PokemonCatalogCore pokemon-catalog-publisher publish \
            --candidate-root publisher/candidate \
            --site-root publisher/site \
            --environment production \
            --change-class "$change_class" \
            "${active_args[@]}" \
            --report publisher/reports/production.json
      - name: Verify the assembled release matches the reviewed candidate
        run: |
          revision="$(jq -er .revision publisher/candidate/catalog-payload.json)"
          for artifact in catalog-payload.json pokemon-catalog-snapshot.json review-report.json; do
            cmp "publisher/candidate/$artifact" "publisher/site/v1/releases/$revision/$artifact"
          done
      - name: Retain the production review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-catalog-production-report-${{ github.run_id }}
          path: publisher/reports/production.json
          if-no-files-found: warn
          retention-days: 90
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.35.1
      - name: Bind and deploy the production Firebase Hosting target
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_HOSTING_SITE_ID"
          service_account_file="${RUNNER_TEMP}/firebase-production-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          firebase target:apply hosting production "$FIREBASE_HOSTING_SITE_ID" \
            --project "$FIREBASE_PROJECT_ID"
          firebase deploy --only hosting:production \
            --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Verify the deployed revision on both catalog hosts
        run: |
          revision="$(jq -er .revision publisher/candidate/catalog-payload.json)"
          readback="$RUNNER_TEMP/pokemon-catalog-readback.json"
          for host in "$POKEMON_CATALOG_PRODUCTION_READ_ORIGIN" https://catalog.scan-stash.com; do
            for artifact in current.json "releases/$revision/catalog-release.json" "releases/$revision/pokemon-catalog-snapshot.json"; do
              for attempt in 1 2 3 4 5 6; do
                if curl --fail --silent --show-error --max-time 25 --proto '=https' \
                  --header 'Cache-Control: no-cache' --output "$readback" "$host/v1/$artifact" &&
                  cmp -s "publisher/site/v1/$artifact" "$readback"; then
                  break
                fi
                if [ "$attempt" -eq 6 ]; then
                  echo "::error::Catalog readback did not match the deployed revision at $host/v1/$artifact"
                  exit 1
                fi
                sleep 5
              done
            done
          done
          echo "Verified revision $revision against both catalog hosts." >> "$GITHUB_STEP_SUMMARY"
