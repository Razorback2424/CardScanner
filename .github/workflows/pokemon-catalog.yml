name: Pokémon catalog

on:
  pull_request:
    paths:
      - "PokemonCatalogCore/**"
      - "MagicCatalogCore/**"
      - "TradingCardScanner/**"
      - "TradingCardScannerTests/PokemonCatalog*.swift"
      - "TradingCardScanner.xcodeproj/project.pbxproj"
      - "Config/**"
      - "publisher/**"
      - "publisher/discovery-policy.json"
      - "scripts/restore_pokemon_catalog_releases.sh"
      - "scripts/restore_catalog_hosting_site.sh"
      - "scripts/catalog_hosting_cache.py"
      - "scripts/cloudflare_cache.py"
      - "scripts/r2_catalog_publish.py"
      - "scripts/verify_hosting_cache.py"
      - "scripts/market_price_feeds.py"
      - "scripts/market_price_rollback.py"
      - "scripts/verify_pokemon_catalog_hosting_config.sh"
      - "scripts/catalog_release_preflight.py"
      - "Config/Cloudflare/catalog-cache-rules.json"
      - "firebase.json"
      - ".firebaserc.example"
      - ".github/workflows/pokemon-catalog.yml"
  push:
    paths:
      - "PokemonCatalogCore/**"
      - "MagicCatalogCore/**"
      - "TradingCardScanner/**"
      - "TradingCardScannerTests/PokemonCatalog*.swift"
      - "TradingCardScanner.xcodeproj/project.pbxproj"
      - "Config/**"
      - "publisher/**"
      - "publisher/discovery-policy.json"
      - "scripts/restore_pokemon_catalog_releases.sh"
      - "scripts/restore_catalog_hosting_site.sh"
      - "scripts/catalog_hosting_cache.py"
      - "scripts/cloudflare_cache.py"
      - "scripts/r2_catalog_publish.py"
      - "scripts/verify_hosting_cache.py"
      - "scripts/market_price_feeds.py"
      - "scripts/market_price_rollback.py"
      - "scripts/verify_pokemon_catalog_hosting_config.sh"
      - "scripts/catalog_release_preflight.py"
      - "Config/Cloudflare/catalog-cache-rules.json"
      - "firebase.json"
      - ".firebaserc.example"
      - ".github/workflows/pokemon-catalog.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a previously validated candidate"
        required: true
        default: false
        type: boolean
      candidate_run_id:
        description: "Workflow run containing the reviewed candidate"
        required: false
        type: string
      candidate_manifest_sha256:
        description: "Reviewed candidate manifest SHA-256"
        required: false
        type: string
      reviewed_candidate_revision:
        description: "Prepare the retained candidate for this revision instead of reading live providers"
        type: string
      bootstrap:
        description: "Allow initial publication when no production pointer exists"
        default: false
        type: boolean
permissions:
  contents: read

env:
  POKEMON_CATALOG_PRODUCTION_READ_ORIGIN: https://catalog-staging.scan-stash.com
  FIREBASE_CATALOG_BACKUP_ORIGIN: https://scanstash-catalog-prod.web.app

jobs:
  validate:
    name: Validate core and recorded fixture
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firebase Hosting production configuration
        run: bash scripts/verify_pokemon_catalog_hosting_config.sh
      - name: Test the macOS core
        run: swift test --package-path PokemonCatalogCore
      - name: Build the publisher in release mode
        run: swift build -c release --package-path PokemonCatalogCore
      - name: Validate the recorded publication input
        run: >-
          swift run --package-path PokemonCatalogCore pokemon-catalog-publisher validate
          --fixture-dir publisher/fixtures
          --generated-at 2026-01-01T00:00:00Z
          --report publisher/reports/pull-request.json

  prepare-production:
    name: Prepare and validate production candidate
    needs: validate
    outputs:
      has_changes: ${{ steps.prepare.outputs.has_changes }}
      requires_approval: ${{ steps.prepare.outputs.requires_approval }}
      candidate_manifest_sha256: ${{ steps.candidate_manifest.outputs.sha256 }}
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == false)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Read the active production pointer
        run: |
          active_path="${RUNNER_TEMP}/pokemon-catalog-production-current.json"
          if ! status="$(curl --compressed --location --proto '=https' --tlsv1.2 --max-redirs 3 --silent --show-error \
            --header 'Cache-Control: no-cache' \
            "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}/v1/current.json?r2v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$active_path" \
            --write-out '%{http_code}')"; then
            echo "Failed to read the active production pointer" >&2
            exit 1
          fi
          case "$status" in
            200)
              echo "Active production release downloaded to $active_path"
              ;;
            404)
              if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.bootstrap }}" != "true" ]; then
                echo "::error::Production pointer v1/current.json is missing; refusing implicit re-baseline. Restore the last verified release, or dispatch with bootstrap=true." >&2
                exit 1
              fi
              echo "Explicit bootstrap: preparing initial publication"
              rm -f "$active_path"
              ;;
            *)
              echo "Unexpected HTTP $status while reading the active production pointer" >&2
              exit 1
              ;;
          esac
      - name: Validate the scoped live production candidate
        if: inputs.reviewed_candidate_revision == ''
        run: |
          swift run --package-path PokemonCatalogCore pokemon-catalog-publisher validate \
            --input publisher/catalog-input.json \
            --discovery-policy publisher/discovery-policy.json \
            --active-release "${RUNNER_TEMP}/pokemon-catalog-production-current.json" \
            --environment production \
            --live true \
            --candidate-root publisher/candidate \
            --report publisher/reports/production.json
      - name: Validate the retained production candidate
        if: github.event_name == 'workflow_dispatch' && inputs.reviewed_candidate_revision != ''
        env:
          REVIEWED_REVISION: ${{ inputs.reviewed_candidate_revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_REVISION" =~ ^[1-9][0-9]*$ ]]
          source="publisher/pokemon/production/revision-$REVIEWED_REVISION"
          test "$(jq -er .revision "$source/catalog-payload.json")" = "$REVIEWED_REVISION"
          swift run --package-path PokemonCatalogCore pokemon-catalog-publisher verify-candidate \
            --candidate-root "$source" --environment production \
            --active-release "${RUNNER_TEMP}/pokemon-catalog-production-current.json"
          mkdir -p publisher/candidate publisher/reports
          cp "$source"/{catalog-payload.json,pokemon-catalog-snapshot.json,review-report.json} publisher/candidate/
          cp "$source/review-report.json" publisher/reports/production.json
      - name: Check the catalog size budget
        run: python3 scripts/catalog_release_preflight.py --game pokemon --payload publisher/candidate/pokemon-catalog-snapshot.json
      - name: Classify the production candidate
        id: prepare
        run: |
          change_class="$(jq -r '.changeClass // "unknown"' publisher/reports/production.json)"
          case "$change_class" in
            none)
              has_changes="false"
              requires_approval="false"
              ;;
            contentOnly)
              has_changes="true"
              requires_approval="false"
              ;;
            baselineMigration|authority|newSet)
              has_changes="true"
              requires_approval="true"
              ;;
            unknown)
              echo "Unknown catalog change class: $change_class" >&2
              exit 1
              ;;
            *)
              echo "Unknown catalog change class: $change_class" >&2
              exit 1
              ;;
          esac

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "requires_approval=$requires_approval" >> "$GITHUB_OUTPUT"
          echo "Catalog candidate changes: $has_changes"
          echo "Catalog change class: $change_class"
          echo "Catalog authority approval required: $requires_approval"
          {
            echo "## Pokémon catalog production candidate"
            jq -r '"- Revision: \(.revision)", "- Change class: \(.changeClass)", "- Added: \(.addedProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Content: \(.contentChangedProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Authority: \(.authorityChangedProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Baseline: \(.baselineFingerprintProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Excluded: \(.excludedProviderSetIDs | if length == 0 then "none" else join(", ") end)", "- Secondary provider available: \(.secondaryProviderAvailable)", "- Ambiguous secondary matches: \(.ambiguousSecondaryMatches | if length == 0 then "none" else join(", ") end)"' \
              publisher/reports/production.json
            echo "- Approval required: $requires_approval"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the candidate SHA-256 manifest
        id: candidate_manifest
        run: |
          (
            cd publisher
            shasum -a 256 \
              candidate/catalog-payload.json \
              candidate/pokemon-catalog-snapshot.json \
              candidate/review-report.json \
              reports/production.json \
              > reports/production-manifest.sha256
          )
          manifest_sha256="$(shasum -a 256 publisher/reports/production-manifest.sha256 | awk '{print $1}')"
          echo "sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "- Candidate run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate manifest SHA-256: $manifest_sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the validated production candidate
        id: upload-candidate
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-catalog-production-candidate-${{ github.run_id }}
          path: |
            publisher/candidate
            publisher/reports/production.json
            publisher/reports/production-manifest.sha256
          if-no-files-found: error
          retention-days: 7

  publish-production:
    name: Sign and stage Pokémon catalog
    needs: [validate, prepare-production]
    if: >-
      (!cancelled() && needs.validate.result == 'success' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && needs.prepare-production.result == 'success' &&
        needs.prepare-production.outputs.has_changes == 'true' && needs.prepare-production.outputs.requires_approval == 'false') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true)))
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
    environment: pokemon-catalog-production
    outputs:
      catalog_artifact: ${{ steps.share-catalog.outputs.artifact-id }}
      revision: ${{ steps.stage.outputs.revision }}
    env:
      GITHUB_ENVIRONMENT: pokemon-catalog-production
      POKEMON_CATALOG_PUBLISH: "true"
      POKEMON_CATALOG_SIGNING_KEY: ${{ secrets.POKEMON_CATALOG_SIGNING_KEY }}
      POKEMON_CATALOG_KEY_ID: ${{ secrets.POKEMON_CATALOG_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select the production candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_RUN_ID: ${{ inputs.candidate_run_id }}
          REVIEWED_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          PREPARED_MANIFEST_SHA256: ${{ needs.prepare-production.outputs.candidate_manifest_sha256 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            candidate_run="$REVIEWED_RUN_ID"
            candidate_sha="$REVIEWED_MANIFEST_SHA256"
            if ! [[ "$candidate_run" =~ ^[1-9][0-9]*$ && "$candidate_sha" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Supply the reviewed run ID and manifest SHA-256 from a candidate preparation run."
              exit 1
            fi
            workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pokemon-catalog.yml" --jq .id)"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run" |
              jq -e --argjson workflow "$workflow_id" --arg repository "$GITHUB_REPOSITORY" '
                .workflow_id == $workflow and .head_repository.full_name == $repository and
                .head_branch == "main" and .conclusion == "success" and
                (.event == "schedule" or .event == "workflow_dispatch")' > /dev/null
          else
            candidate_run="$GITHUB_RUN_ID"
            candidate_sha="$PREPARED_MANIFEST_SHA256"
          fi
          echo "run_id=$candidate_run" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Download the validated production candidate
        uses: actions/download-artifact@v4
        with:
          name: pokemon-catalog-production-candidate-${{ steps.candidate.outputs.run_id }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: publisher
      - name: Verify downloaded production candidate
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.candidate.outputs.manifest_sha256 }}
        run: |
          test -f publisher/candidate/catalog-payload.json
          test -f publisher/candidate/pokemon-catalog-snapshot.json
          test -f publisher/candidate/review-report.json
          test -f publisher/reports/production.json
          test -f publisher/reports/production-manifest.sha256
          actual_manifest_sha256="$(shasum -a 256 publisher/reports/production-manifest.sha256 | awk '{print $1}')"
          test "$actual_manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          (
            cd publisher
            shasum -a 256 -c reports/production-manifest.sha256
          )
      - name: Read the active R2 production pointer
        run: |
          active_path="${RUNNER_TEMP}/pokemon-catalog-production-current.json"
          if ! status="$(curl --compressed --location --proto '=https' --tlsv1.2 --max-redirs 3 --silent --show-error \
            --header 'Cache-Control: no-cache' \
            "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}/v1/current.json?r2v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$active_path" \
            --write-out '%{http_code}')"; then
            echo "Failed to read the active production pointer" >&2
            exit 1
          fi
          case "$status" in
            200)
              echo "Active production release downloaded to $active_path"
              ;;
            404)
              if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.bootstrap }}" != "true" ]; then
                echo "::error::Production pointer v1/current.json is missing; refusing implicit re-baseline. Restore the last verified release, or dispatch with bootstrap=true." >&2
                exit 1
              fi
              echo "Explicit bootstrap: preparing initial publication"
              rm -f "$active_path"
              ;;
            *)
              echo "Unexpected HTTP $status while reading the active production pointer" >&2
              exit 1
              ;;
          esac
      - name: Recheck the candidate against the active production release
        run: |
          active_path="${RUNNER_TEMP}/pokemon-catalog-production-current.json"
          active_args=()
          if [ -f "$active_path" ]; then
            active_args+=(--active-release "$active_path")
          fi
          swift run --package-path PokemonCatalogCore pokemon-catalog-publisher verify-candidate \
            --candidate-root publisher/candidate --environment production \
            "${active_args[@]}"
      - name: Sign and stage the immutable revision and pointer for R2
        id: stage
        run: |
          active_path="${RUNNER_TEMP}/pokemon-catalog-production-current.json"
          active_args=()
          metadata_args=()
          if [ -f "$active_path" ]; then
            previous_revision="$(swift run --package-path PokemonCatalogCore pokemon-catalog-publisher verify-release \
              --path "$active_path" --environment production \
              --trusted-keys-file Config/PokemonCatalogProduction.xcconfig)"
            active_args+=(--active-release "$active_path")
            metadata_args+=(--previous-revision "$previous_revision" --previous-pointer "$active_path")
          fi
          change_class="$(jq -er .changeClass publisher/candidate/review-report.json)"
          case "$change_class" in
            contentOnly) ;;
            baselineMigration|authority|newSet) test "$GITHUB_EVENT_NAME" = "workflow_dispatch" ;;
            *) echo "::error::Catalog change class is ineligible for publication"; exit 1 ;;
          esac
          rm -rf publisher/r2-catalog-candidate
          mkdir -p publisher/r2-catalog-candidate/site
          swift run --package-path PokemonCatalogCore pokemon-catalog-publisher publish \
            --candidate-root publisher/candidate \
            --site-root publisher/r2-catalog-candidate/site \
            --environment production \
            --change-class "$change_class" \
            "${active_args[@]}" \
            --report publisher/reports/production.json
          revision="$(jq -er .revision publisher/candidate/catalog-payload.json)"
          for artifact in catalog-payload.json pokemon-catalog-snapshot.json review-report.json; do
            cmp "publisher/candidate/$artifact" "publisher/r2-catalog-candidate/site/v1/releases/$revision/$artifact"
          done
          swift run --skip-build --package-path PokemonCatalogCore pokemon-catalog-publisher verify-release \
            --path "publisher/r2-catalog-candidate/site/v1/current.json" --environment production \
            --trusted-keys-file Config/PokemonCatalogProduction.xcconfig --expected-revision "$revision" >/dev/null
          python3 scripts/r2_catalog_publish.py \
            --site publisher/r2-catalog-candidate/site \
            --write-catalog-metadata publisher/r2-catalog-candidate/catalog-publish-metadata.json \
            --namespace v1 --revision "$revision" "${metadata_args[@]}"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Retain the production review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-catalog-production-report-${{ github.run_id }}
          path: publisher/reports/production.json
          if-no-files-found: warn
          retention-days: 90
      - name: Hand off the verified Pokémon release to R2
        id: share-catalog
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-r2-catalog-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: publisher/r2-catalog-candidate
          if-no-files-found: error
          retention-days: 7

  publish-r2-catalog:
    name: Publish and verify primary R2 Pokémon catalog
    needs: publish-production
    if: ${{ !cancelled() && needs.publish-production.result == 'success' && needs.publish-production.outputs.catalog_artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: r2-catalog-production
    concurrency:
      group: scanstash-catalog-r2-hosting
      cancel-in-progress: false
      queue: max
    outputs:
      origin_verified: ${{ steps.publish.outputs.origin_verified }}
      cache_verified: ${{ steps.publish.outputs.cache_verified }}
      inventory_artifact: ${{ steps.share-inventory.outputs.artifact-id }}
    steps:
      - name: Require the staged Pokémon artifact
        env:
          ARTIFACT_ID: ${{ needs.publish-production.outputs.catalog_artifact }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo 'The staged Pokémon catalog artifact could not be handed off to R2.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-production.outputs.catalog_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/pokemon-r2-catalog
      - name: Publish immutable release, activate pointer and verify Cloudflare cache
        id: publish
        env:
          PYTHONUNBUFFERED: "1"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_CACHE_ENFORCE: ${{ vars.CLOUDFLARE_CACHE_ENFORCE }}
          REVISION: ${{ needs.publish-production.outputs.revision }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in r2-catalog-production}"
          : "${AWS_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in r2-catalog-production}"
          set +e
          python3 scripts/r2_catalog_publish.py \
            --primary-catalog v1 \
            --catalog-metadata "$RUNNER_TEMP/pokemon-r2-catalog/catalog-publish-metadata.json" \
            --site "$RUNNER_TEMP/pokemon-r2-catalog/site" \
            --public-base "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}" \
            --cache-report "$RUNNER_TEMP/pokemon-cache-verification.json" \
            --verify-all
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 2 ]]; then
            exit "$rc"
          fi
          echo "origin_verified=true" >> "$GITHUB_OUTPUT"
          cache_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cacheStatus"])' "$RUNNER_TEMP/pokemon-cache-verification.json")"
          echo "cache_verified=$cache_status" >> "$GITHUB_OUTPUT"
          echo "Origin verification (nonce-based) passed for Pokémon revision $REVISION on R2. Client-visible cache verification: $cache_status. Firebase backup reports separately." >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory R2 price builds for Firebase backup
        id: inventory
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          : "${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in r2-catalog-production}"
          list_r2=(aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            --cli-connect-timeout 10 --cli-read-timeout 60 --no-cli-pager --output json
            s3api list-objects-v2 --bucket "$R2_BUCKET_NAME")
          "${list_r2[@]}" --prefix market-prices/v2/verified-builds/ --query 'Contents[].Key' \
            > "$RUNNER_TEMP/r2-verified-builds.json"
          "${list_r2[@]}" --prefix market-prices/v2/builds/ --delimiter / --query 'CommonPrefixes[].Prefix' \
            > "$RUNNER_TEMP/r2-legacy-inventory.json"
      - name: Share R2 price inventory for Firebase backup
        if: steps.inventory.outcome == 'success'
        id: share-inventory
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-r2-price-builds-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r2-verified-builds.json
            ${{ runner.temp }}/r2-legacy-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce client-visible cache verification status
        if: steps.publish.outputs.cache_verified != 'passed'
        env:
          CACHE_STATUS: ${{ steps.publish.outputs.cache_verified }}
        run: |
          if [[ "$CACHE_STATUS" == "failed" ]]; then
            echo '::error title=Cloudflare cache verification failed::Pokémon R2 origin publication is active, but purge or canonical verification failed. Not eligible for Stage 2 cutover readiness until recovered.'
            exit 1
          fi
          echo '::warning title=Cloudflare cache verification skipped::Configure CLOUDFLARE_ZONE_ID and CLOUDFLARE_CACHE_PURGE_TOKEN in r2-catalog-production for Stage 2 cache readiness.'

  backup-firebase-catalog:
    name: Back up verified R2 site to Firebase
    needs: [publish-production, publish-r2-catalog]
    if: ${{ !cancelled() && needs.publish-r2-catalog.outputs.origin_verified == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    environment: pokemon-catalog-production
    concurrency:
      group: scanstash-catalog-production-hosting
      cancel-in-progress: false
      queue: max
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE_ID: ${{ secrets.FIREBASE_HOSTING_SITE_ID }}
      REVISION: ${{ needs.publish-production.outputs.revision }}
    steps:
      - name: Require the R2 price build inventory
        env:
          INVENTORY_ARTIFACT: ${{ needs.publish-r2-catalog.outputs.inventory_artifact }}
        run: |
          if [[ ! "$INVENTORY_ARTIFACT" =~ ^[0-9]+$ ]]; then
            echo '::error title=Firebase catalog backup::The R2 price build inventory is unavailable.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/r2-catalog-cache
          key: r2-catalog-restore-v1-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-catalog-restore-v1-
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-r2-catalog.outputs.inventory_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/r2-price-inventory
      - name: Restore the complete verified site from R2
        env:
          PREFER_R2_PRICE_HISTORY: "true"
        run: |
          export CATALOG_RESTORE_CACHE_WORK="$RUNNER_TEMP/r2-catalog-pointers"
          python3 scripts/catalog_hosting_cache.py prepare --origin "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}" \
            --site publisher/site --cache "$RUNNER_TEMP/r2-catalog-cache" --work "$CATALOG_RESTORE_CACHE_WORK"
          bash scripts/restore_catalog_hosting_site.sh \
            "$CATALOG_RESTORE_CACHE_WORK/pokemon-current.json" \
            "$CATALOG_RESTORE_CACHE_WORK/magic-current.json" publisher/site \
            "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}" \
            PokemonCatalogCore Config/PokemonCatalogProduction.xcconfig \
            MagicCatalogCore Config/MagicCatalogProduction.xcconfig \
            "$CATALOG_RESTORE_CACHE_WORK/one-piece-current.json" \
            OnePieceCatalogCore Config/OnePieceCatalogProduction.xcconfig \
            "$CATALOG_RESTORE_CACHE_WORK/yugioh-current.json"
          test -f "publisher/site/v1/releases/$REVISION/catalog-release.json"
          bash scripts/verify_pokemon_catalog_hosting_config.sh
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.35.1
      - name: Confirm R2 parity and deploy Firebase backup
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_HOSTING_SITE_ID"
          service_account_file="${RUNNER_TEMP}/firebase-production-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          firebase target:apply hosting production "$FIREBASE_HOSTING_SITE_ID" \
            --project "$FIREBASE_PROJECT_ID"
          python3 scripts/catalog_hosting_cache.py confirm --origin "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}" \
            --site publisher/site --work "$RUNNER_TEMP/r2-catalog-pointers"
          python3 scripts/catalog_hosting_cache.py confirm-r2-scopes --site publisher/site
          inventory="$RUNNER_TEMP/r2-price-inventory/r2-verified-builds.json"
          if [[ ! -f publisher/site/market-prices/v2/history.json ]]; then
            inventory="$RUNNER_TEMP/r2-price-inventory/r2-legacy-inventory.json"
          fi
          python3 -u scripts/market_price_rollback.py sync-r2 --site-root publisher/site --r2-inventory "$inventory"
          firebase deploy --only hosting:production \
            --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Verify Firebase backup readback and R2 parity
        run: |
          python3 scripts/catalog_hosting_cache.py verify-firebase-catalogs \
            --site publisher/site --namespace v1 --revision "$REVISION"
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import NAMESPACE, restore
          destination = Path('publisher/price-readback')
          assert restore(destination, require_fresh=False, require_present=True)
          expected = Path('publisher/site') / NAMESPACE / 'index.json'
          assert (destination / NAMESPACE / 'index.json').read_bytes() == expected.read_bytes()
          PY
          python3 -u scripts/market_price_rollback.py verify --site-root publisher/site
          python3 scripts/market_price_rollback.py confirm-primary --site-root publisher/site
          python3 scripts/catalog_hosting_cache.py confirm --origin "${POKEMON_CATALOG_PRODUCTION_READ_ORIGIN}" \
            --site publisher/site --work "$RUNNER_TEMP/r2-catalog-pointers"
          echo "Verified Firebase backup for Pokémon revision $REVISION against $FIREBASE_CATALOG_BACKUP_ORIGIN." >> "$GITHUB_STEP_SUMMARY"
      - name: Seal the verified R2 catalog cache
        id: catalog-cache
        continue-on-error: true
        run: |
          key=$(python3 scripts/catalog_hosting_cache.py seal --site publisher/site \
            --cache "$RUNNER_TEMP/r2-catalog-cache" --work "$RUNNER_TEMP/r2-catalog-pointers")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.catalog-cache.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/r2-catalog-cache
          key: r2-catalog-restore-v1-${{ steps.catalog-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report a failed backup separately from the primary publication
        if: failure()
        run: |
          echo '::warning title=Firebase Pokémon catalog backup failed::The verified R2 catalog publication remains active.'
          echo 'Firebase backup failed. The verified R2 Pokémon catalog publication remains active.' >> "$GITHUB_STEP_SUMMARY"
