name: Catalog coverage regressions

on:
  pull_request:
    paths:
      - "TradingCardScanner/**"
      - "TradingCardScannerTests/**"
      - "TradingCardScanner.xcodeproj/**"
      - "*CatalogCore/**"
      - "Config/*Catalog*.xcconfig"
      - "TestFixtures/TradingCards/**"
      - "publisher/catalog-input.json"
      - "scripts/**"
      - ".github/workflows/catalog-coverage-tests.yml"

permissions:
  contents: read

concurrency:
  group: catalog-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test offline ingestion and mapping policies
        run: |
          # The finish ledger pins this baseline; its objects are required by the audit.
          git fetch --no-tags --depth=1 origin 4a9d70b12d941877e2752fe9cfb5fd1508ce0520
          python3 -m unittest discover -s scripts/tests -v
      - name: Audit pinned Pokemon finish ledger and retained resources
        run: python3 scripts/audit_pokemon_finish_repairs.py --check-table
      - name: Test Yu-Gi-Oh membership and printing families
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/fixtures/yugioh -v
      - name: Check retained catalog integrity and report coverage gaps
        env:
          CATALOG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CATALOG_BASE_SHA"
          python3 scripts/audit_catalog_coverage.py --repo . --output "$RUNNER_TEMP/catalog-coverage" --lorcana-baseline-ref "$CATALOG_BASE_SHA"
      - name: Retain the catalog census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-coverage-census
          path: ${{ runner.temp }}/catalog-coverage
          retention-days: 14

  ios-catalog:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify the native candidate commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Test publisher contracts and catalog cores on the recorded toolchain
        run: |
          set -euo pipefail
          swift test --package-path PokemonCatalogCore
          swift test --package-path MagicCatalogCore
          bash scripts/build_yugioh_publisher.sh "$RUNNER_TEMP/yugioh-publisher"
          YUGIOH_CATALOG_PUBLISHER="$RUNNER_TEMP/yugioh-publisher" python3 -m unittest discover -s scripts/tests -p test_yugioh_publisher.py -v
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          ordered = sorted(devices.items(), key=lambda item: (item[0].endswith('.iOS-27-0'), item[0]), reverse=True)
          phones = [device for runtime, group in ordered
                    if '.iOS-' in runtime for device in group if device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No iPhone simulator is installed')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CATALOG_TEST_DEVICE=' + phones[0]['udid'] + '\n')
          PY
      # The extra selections belong to this bounded investigation, not every
      # unrelated catalog PR. No retry-until-green or simulator reset is used.
      - name: Record bounded centering Done comparisons
        if: github.head_ref == 'fix/centering-done-event-sequence'
        continue-on-error: true
        run: |
          python3 scripts/centering_done_diagnostics.py record \
            --device "$CATALOG_TEST_DEVICE" \
            --derived-data "$RUNNER_TEMP/catalog-derived-data" \
            --output "$RUNNER_TEMP/centering-done-diagnostics"
      - name: Retain completed centering comparisons before the combined run
        if: always() && github.head_ref == 'fix/centering-done-event-sequence'
        uses: actions/upload-artifact@v4
        with:
          name: catalog-centering-comparisons
          path: ${{ runner.temp }}/centering-done-diagnostics
          retention-days: 14
      - name: Run scanner, catalog, printing and variant regressions
        run: |
          set -o pipefail
          xcodebuild test \
            -project TradingCardScanner.xcodeproj \
            -scheme TradingCardScanner -configuration Debug \
            -destination "platform=iOS Simulator,id=$CATALOG_TEST_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/catalog-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/catalog-tests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:TradingCardScannerTests/ScanParserTests \
            -only-testing:TradingCardScannerTests/HistoricalTitleCaptureTests \
            -only-testing:TradingCardScannerTests/HistoricalCatalogRequestTests \
            -only-testing:TradingCardScannerTests/VariantResolverTests \
            -only-testing:TradingCardScannerTests/PokemonFinishEvidenceTests \
            -only-testing:TradingCardScannerTests/RetailVariantTests/testSevenOrdinaryHoloMinimumsAutoResolveRetainNormalAndUseExactProducts \
            -only-testing:TradingCardScannerTests/RetailVariantTests/testBrowseWriterRejectsDisputedNormalAndUnavailableMachampEdition \
            -only-testing:TradingCardScannerTests/ScannerViewModelTests/testAutoModeAddsSoleBundledPokemonVariantWithoutPausing \
            -only-testing:TradingCardScannerTests/ScannerViewModelTests/testAutoModeAddsSoleLegacyCachedVariantsAndStillAsksForMultipleVariants \
            -only-testing:TradingCardScannerTests/ScannerViewModelTests/testProvisionalPokemonFinishIsFiledForReviewWithoutWriting \
            -only-testing:TradingCardScannerTests/ScannerViewModelTests/testUnnumberedEnergyScanSavesOnlyTheChosenTypeAndFinish \
            -only-testing:TradingCardScannerTests/UnresolvedScanStoreTests/testStandaloneHistoricalNumberSurvivesRelaunch \
            -only-testing:TradingCardScannerTests/PokemonTCGCSVPriceTests \
            -only-testing:TradingCardScannerTests/CollectionKeyTests \
            -only-testing:TradingCardScannerTests/CardLatchTests \
            -only-testing:TradingCardScannerTests/PokemonCatalogPromoPadWidthTests \
            -only-testing:TradingCardScannerTests/PokemonCatalogRegistryTests \
            -only-testing:TradingCardScannerTests/PokemonCatalogParityTests \
            -only-testing:TradingCardScannerTests/PokemonCatalogSliceCTests \
            -only-testing:TradingCardScannerTests/PokemonCatalogSliceDTests \
            -only-testing:TradingCardScannerTests/PokemonCatalogInvalidationTests \
            -only-testing:TradingCardScannerTests/PokemonCatalogCoordinatorInvalidationTests \
            -only-testing:TradingCardScannerTests/PokemonCatalogCoordinatorTests/testSignedChecklistGatesActivationAndReopensWithoutNetwork \
            -only-testing:TradingCardScannerTests/PokemonCatalogCoordinatorTests/testSignedChecklistCannotSupplyFinishesUnderThePreviousRegistry \
            -only-testing:TradingCardScannerTests/PokemonCatalogCoordinatorTests/testCreatorPackCompletesBrowseAndOfflineScanWithCertifiedNormal \
            -only-testing:TradingCardScannerTests/PokemonCatalogCoordinatorTests/testUnnumberedEnergyAlwaysRequiresExplicitPrintingAndRevalidatesTheFamily \
            -only-testing:TradingCardScannerTests/PokemonCatalogCoordinatorTests/testVivillonScanOffersBothArtworkChoicesAndResolvesTheSelectedPrintingOffline \
            -only-testing:TradingCardScannerTests/PokemonChecklistBrowseTests \
            -only-testing:TradingCardScannerTests/PokemonClassicCollectionArtworkTests \
            -only-testing:TradingCardScannerTests/PricingTests \
            -only-testing:TradingCardScannerTests/PortfolioEligibilityIntegrationTests \
            -only-testing:TradingCardScannerTests/PortfolioReplayEngineTests \
            -only-testing:TradingCardScannerTests/PortfolioHistoryEngineTests \
            -only-testing:TradingCardScannerTests/PortfolioCloseTests \
            -only-testing:TradingCardScannerTests/PortfolioLedgerTests \
            -only-testing:TradingCardScannerTests/PortfolioTrustPassTests \
            -only-testing:TradingCardScannerTests/PortfolioReconciliationTests \
            -only-testing:TradingCardScannerTests/CollectionItemKindTests \
            -only-testing:TradingCardScannerTests/CollectionActivityHistoryTests \
            -only-testing:TradingCardScannerTests/RefreshStructuralWriteTests \
            -only-testing:TradingCardScannerTests/JustTCGContractTests \
            -only-testing:TradingCardScannerTests/ProductFallbackTests \
            -only-testing:TradingCardScannerTests/ScannedGradedResolverTests \
            -only-testing:TradingCardScannerTests/PriceRefreshLifecycleTests \
            -only-testing:TradingCardScannerTests/CardShareContentTests \
            -only-testing:TradingCardScannerTests/PriceRefreshSnapshotSliceTests \
            -only-testing:TradingCardScannerTests/PortfolioReconciliationTests/testGradedExpiryUsesReplayCutoffForQuoteAndAliasSelection \
            -only-testing:TradingCardScannerTests/PortfolioReconciliationTests/testExplicitGradedWithdrawalDoesNotRewriteEarlierKnowledgeCutoff \
            -only-testing:TradingCardScannerTests/PortfolioReconciliationTests/testNewerExactSaleObservationCanSupersedeExpiredMutableQuoteOnlyForItsIdentity \
            -only-testing:TradingCardScannerTests/PortfolioReconciliationTests/testExactObservationComparesItsUpdateClockIndependentlyOfLastSaleClock \
            -only-testing:TradingCardScannerTests/CenteringNativePrecisionTests \
            -only-testing:TradingCardScannerTests/CenteringExportTests \
            -only-testing:TradingCardScannerTests/CardCenteringSurfaceTests \
            -only-testing:TradingCardScannerTests/OpusImplementationPlanTests \
            -only-testing:TradingCardScannerTests/BrowseFeatureTests \
            -only-testing:TradingCardScannerTests/StoreRevisionMonitorTests \
            -only-testing:TradingCardScannerTests/MagicPhysicalObjectTests \
            -only-testing:TradingCardScannerTests/LorcanaPhysicalCatalogTests \
            -only-testing:TradingCardScannerTests/LorcanaDiscoveryCatalogTests \
            -only-testing:TradingCardScannerTests/LorcanaPricingTests/testBundledMultiFoilFinishesUseDistinctKeysAndExactQuotes \
            -only-testing:TradingCardScannerTests/LorcanaPricingTests/testScannerFilesHeldFamilyBeforeFinishOrSave \
            -only-testing:TradingCardScannerTests/MagicTokenPairingSessionTests \
            -only-testing:TradingCardScannerTests/CollectionActivityHistoryTests/testReviewedFinishNeverAutomaticallyRekeysAStoredFinishNeedingReview \
            -only-testing:TradingCardScannerTests/MagicContentKindTests \
            -only-testing:TradingCardScannerTests/MagicHistoricalRecognitionTests \
            -only-testing:TradingCardScannerTests/BrowseLoadingRefinementTests \
            -only-testing:TradingCardScannerTests/BrowseCollectionTests/testMagicBrowseCountsTheFinishThatWasActuallySaved \
            -only-testing:TradingCardScannerTests/MagicCatalogBootstrapTests \
            -only-testing:TradingCardScannerTests/CatalogNormalizationTests \
            -only-testing:TradingCardScannerTests/YuGiOhRecognitionTests \
            -only-testing:TradingCardScannerTests/YuGiOhResolutionTests \
            -only-testing:TradingCardScannerTests/OnePieceIntegrationTests \
            -only-testing:TradingCardScannerTests/ImportedItemKindTests \
            -only-testing:TradingCardScannerTests/PortfolioReconciliationTests/testCSVExportAppendsCatalogProviderWithoutReorderingOriginalColumns \
            -only-testing:TradingCardScannerTests/PortfolioReconciliationTests/testCSVRoundTripKeepsDistinctCertificatesApart \
            -only-testing:TradingCardScannerTests/MagicTreatmentTests/testCollectionCSVRoundTripsTreatmentIdentityAndCollectionKey \
            -only-testing:TradingCardScannerTests/LorcanaOwnershipTests/testConflictingDuplicateRowsRetainEvidenceThroughFailedExport \
            -only-testing:TradingCardScannerTests/LorcanaOwnershipTests/testFailedCSVRowCanBeCorrectedAndRetriedWithoutDuplicatingCommittedCopies \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/catalog-native-tests.log"
      - name: Require executed centering cases and retain failed attempts
        if: always() && steps.simulator.outcome == 'success' && github.head_ref == 'fix/centering-done-event-sequence'
        run: |
          python3 scripts/centering_done_diagnostics.py verify \
            --output "$RUNNER_TEMP/centering-done-diagnostics" \
            --combined-log "$RUNNER_TEMP/catalog-native-tests.log" \
            --combined-result-bundle "$RUNNER_TEMP/catalog-tests.xcresult"
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-native-results
          path: |
            ${{ runner.temp }}/catalog-tests.xcresult
            ${{ runner.temp }}/catalog-native-tests.log
            ${{ runner.temp }}/centering-done-diagnostics
          retention-days: 14
