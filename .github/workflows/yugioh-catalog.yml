name: YuGiOh catalog candidate
on:
  workflow_dispatch:
    inputs:
      publish_prices:
        description: "Publish the validated daily price feeds (does not activate a catalog)"
        type: boolean
        default: false
      reconcile_catalog_history:
        description: "Recheck all historical revisions after an origin repair (requires publish_prices)"
        type: boolean
        default: false
  schedule:
    - cron: "23 1,7,13,19 * * *"
permissions:
  contents: read
jobs:
  ingest-candidate:
    runs-on: macos-15-intel
    timeout-minutes: 45
    concurrency:
      group: scanstash-tcgcsv-daily-ingestion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Test evidence admission
        run: python3 -I scripts/build_yugioh_catalog.py --self-test
      - name: Build and test the standalone publisher
        run: |
          bash scripts/build_yugioh_publisher.sh "$RUNNER_TEMP/yugioh-publisher"
          YUGIOH_CATALOG_PUBLISHER="$RUNNER_TEMP/yugioh-publisher" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_yugioh_publisher.py
      - name: Test daily price contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_market_price_feeds.py
      - name: Identify the upstream daily build
        id: upstream
        run: |
          mkdir -p "$RUNNER_TEMP/yugioh-source"
          curl --fail --proto '=https' --tlsv1.2 --max-filesize 1024 --max-time 45 \
            --user-agent 'ScanStashPricePublisher/1.0' \
            https://tcgcsv.com/last-updated.txt -o "$RUNNER_TEMP/yugioh-source/source-build-start.txt"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import instant, stamp
          raw = (Path(os.environ['RUNNER_TEMP']) / 'yugioh-source/source-build-start.txt').read_bytes()
          assert instant(raw.decode().strip()) <= instant(stamp())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build_hash=' + hashlib.sha256(raw).hexdigest() + '\n')
          PY
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/yugioh-source
          key: tcgcsv-daily-${{ steps.upstream.outputs.build_hash }}
      # The approved parent can be 68 MB. Keep the last copy and revalidate it
      # with its ETag so an unchanged parent costs a 304, not a full download.
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/yugioh-parent-cache
          key: yugioh-approved-parent-v1-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: yugioh-approved-parent-v1-
      - name: Resolve the latest verified approved parent
        id: approved-parent
        env:
          APPROVED_PARENT_URL: ${{ vars.YUGIOH_APPROVED_PARENT_URL }}
        run: |
          if [ -z "$APPROVED_PARENT_URL" ]; then
            echo "No production YGO approval endpoint is configured; bootstrap candidate only"
            echo "YUGIOH_PREVIOUS_SEED=TradingCardScanner/YuGiOhCatalogSeed/catalog.json" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$APPROVED_PARENT_URL" in
            https://catalog-staging.scan-stash.com/yugioh/v1/current.json|https://scanstash-catalog-prod.web.app/yugioh/v1/current.json|https://catalog.scan-stash.com/yugioh/v1/current.json) ;;
            *) echo "Unapproved parent origin/path" >&2; exit 1 ;;
          esac
          cache="$RUNNER_TEMP/yugioh-parent-cache"
          mkdir -p "$cache"
          rm -f "$cache/parent.download" "$cache/etag.new"
          etag_args=(--etag-save "$cache/etag.new")
          if [ -s "$cache/parent.json" ] && [ -s "$cache/etag" ]; then
            etag_args+=(--etag-compare "$cache/etag")
          fi
          status=$(curl --fail --proto '=https' --tlsv1.2 --compressed --max-filesize 68157440 --max-time 60 \
            "${etag_args[@]}" -w '%{http_code}' "$APPROVED_PARENT_URL" -o "$cache/parent.download")
          case "$status" in
            304) echo "Approved parent unchanged; reusing the cached copy" ;;
            200) mv "$cache/parent.download" "$cache/parent.json"; mv "$cache/etag.new" "$cache/etag" ;;
            *) echo "Unexpected approved parent status $status" >&2; exit 1 ;;
          esac
          # The cached copy is verified against the pinned keys below on every run.
          cp "$cache/parent.json" "$RUNNER_TEMP/yugioh-approved-parent.json"
          echo "key=$(shasum -a 256 "$cache/parent.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/yugioh-publisher" export-parent --input "$RUNNER_TEMP/yugioh-approved-parent.json" \
            --keys Config/YuGiOhCatalogProduction.keys.json --output "$RUNNER_TEMP/yugioh-approved-parent-catalog.json"
          echo "YUGIOH_PREVIOUS_SEED=$RUNNER_TEMP/yugioh-approved-parent-catalog.json" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        if: steps.approved-parent.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/yugioh-parent-cache
          key: yugioh-approved-parent-v1-${{ steps.approved-parent.outputs.key }}
      - name: Ingest once on the server and stage a candidate
        shell: bash
        run: |
          calendar="$RUNNER_TEMP/yugioh-release-calendar.html"
          calendar_args=()
          if curl --fail --proto '=https' --tlsv1.2 --retry 2 --max-filesize 4000000 --max-time 35 \
            'https://www.db.yugioh-card.com/yugiohdb/card_list.action?wname=CardSearch&request_locale=en' -o "$calendar"; then
            if python3 scripts/yugioh_official_inventory.py "$calendar" "$RUNNER_TEMP/verified-release-calendar.json"; then
              calendar_args+=(--release-calendar-html "$calendar")
            fi
          fi
          if [ "${#calendar_args[@]}" -eq 0 ]; then
            echo '::warning title=Yu-Gi-Oh! release calendar::Fresh Konami directory unavailable. Using the checked-in capture.'
          fi
          python3 -I scripts/build_yugioh_catalog.py \
            --cache-dir "$RUNNER_TEMP/yugioh-source" \
            --previous-seed "$YUGIOH_PREVIOUS_SEED" \
            --out "$RUNNER_TEMP/yugioh/catalog.json" \
            --report "$RUNNER_TEMP/yugioh/build-report.md" \
            --check-recent-official-releases \
            --hosting-root "$RUNNER_TEMP/yugioh/site" \
            --publication-revision "${{ github.run_number }}" "${calendar_args[@]}"
      - name: Bind the completed capture to the same upstream build
        run: |
          curl --fail --proto '=https' --tlsv1.2 --max-filesize 1024 --max-time 45 \
            --user-agent 'ScanStashPricePublisher/1.0' \
            https://tcgcsv.com/last-updated.txt -o "$RUNNER_TEMP/yugioh-source/source-build-end.txt"
          cmp "$RUNNER_TEMP/yugioh-source/source-build-start.txt" "$RUNNER_TEMP/yugioh-source/source-build-end.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: yugioh-catalog-candidate
          path: ${{ runner.temp }}/yugioh
          retention-days: 7
      - name: Retain catalog diagnostics when staging fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-catalog-diagnostics
          path: |
            ${{ runner.temp }}/yugioh/build-report.md
            ${{ runner.temp }}/yugioh/build-report.coverage.json
            ${{ runner.temp }}/yugioh/build-report.exclusions.json
          if-no-files-found: ignore
          retention-days: 7
      # Catalog candidates remain separate from the price-only publication below.

  publish-prices-to-r2:
    name: Publish and verify primary R2 prices
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_prices == true) ||
       (github.event_name == 'schedule' && vars.MARKET_PRICE_FEEDS_ACTIVE == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: r2-catalog-production
    concurrency:
      group: scanstash-catalog-r2-hosting
      cancel-in-progress: false
      queue: max
    outputs:
      origin_verified: ${{ steps.publish.outputs.origin_verified }}
      cache_verified: ${{ steps.publish.outputs.cache_verified }}
      price_artifact: ${{ steps.share.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Identify the current upstream price build for capture reuse
        id: upstream
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from market_price_feeds import digest, instant, read_http, stamp
          marker = read_http('https://tcgcsv.com/last-updated.txt', 1024).decode().strip()
          if instant(marker) > instant(stamp()):
              raise ValueError('The upstream price build is in the future')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('key=' + digest(marker.encode()), file=output)
          PY
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/market-price-source
          key: tcgcsv-r2-${{ steps.upstream.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tcgcsv-r2-${{ steps.upstream.outputs.key }}-
      - name: Prepare prices using only the upstream feed and active R2 catalog scopes
        run: |
          site="$RUNNER_TEMP/r2-price-candidate/site"
          python3 scripts/market_price_feeds.py capture-r2-scopes --site-root "$site"
          python3 scripts/market_price_feeds.py prepare --cache-dir "$RUNNER_TEMP/market-price-source" \
            --catalog-scopes "$site" --site-root "$site" --report "$RUNNER_TEMP/r2-price-candidate/report.json"
      - name: Publish immutable R2 prices, read back legacy prices and verify Cloudflare cache
        id: publish
        env:
          PYTHONUNBUFFERED: "1"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_CACHE_ENFORCE: ${{ vars.CLOUDFLARE_CACHE_ENFORCE }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in r2-catalog-production}"
          : "${AWS_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in r2-catalog-production}"
          set +e
          python3 scripts/r2_catalog_publish.py --primary-prices --verify-all \
            --site "$RUNNER_TEMP/r2-price-candidate/site" \
            --public-base https://catalog-staging.scan-stash.com \
            --cache-report "$RUNNER_TEMP/price-cache-verification.json"
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 2 ]]; then
            exit "$rc"
          fi
          echo "origin_verified=true" >> "$GITHUB_OUTPUT"
          cache_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cacheStatus"])' "$RUNNER_TEMP/price-cache-verification.json")"
          echo "cache_verified=$cache_status" >> "$GITHUB_OUTPUT"
          echo "Origin verification (nonce-based) passed for R2 primary pricing. Client-visible cache verification: $cache_status. Firebase backup reports separately." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: share
        continue-on-error: true
        with:
          name: r2-verified-prices-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2-price-candidate
          if-no-files-found: error
          retention-days: 7
      - name: Enforce client-visible cache verification status
        if: steps.publish.outputs.cache_verified != 'passed'
        env:
          CACHE_STATUS: ${{ steps.publish.outputs.cache_verified }}
        run: |
          if [[ "$CACHE_STATUS" == "failed" ]]; then
            echo '::error title=Cloudflare cache verification failed::R2 primary price publication is active, but purge or canonical verification failed. Not eligible for Stage 2 cutover readiness until recovered.'
            exit 1
          fi
          echo '::warning title=Cloudflare cache verification skipped::Configure CLOUDFLARE_ZONE_ID and CLOUDFLARE_CACHE_PURGE_TOKEN in r2-catalog-production for Stage 2 cache readiness.'

  inventory-r2-price-builds:
    name: Inventory R2 history for Firebase backup
    needs: publish-prices-to-r2
    if: ${{ !cancelled() && needs.publish-prices-to-r2.outputs.origin_verified == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: r2-catalog-production
    outputs:
      inventory_artifact: ${{ steps.share.outputs.artifact-id }}
    steps:
      - name: Inventory R2 builds available to the backup
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          : "${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in r2-catalog-production}"
          : "${AWS_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in r2-catalog-production}"
          : "${AWS_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in r2-catalog-production}"
          list_r2=(aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            --cli-connect-timeout 10 --cli-read-timeout 60 --no-cli-pager --output json
            s3api list-objects-v2 --bucket "$R2_BUCKET_NAME")
          "${list_r2[@]}" --prefix market-prices/v2/verified-builds/ --query 'Contents[].Key' \
            > "$RUNNER_TEMP/r2-verified-builds.json"
          "${list_r2[@]}" --prefix market-prices/v2/builds/ --delimiter / --query 'CommonPrefixes[].Prefix' \
            > "$RUNNER_TEMP/r2-legacy-inventory.json"
      - uses: actions/upload-artifact@v4
        id: share
        with:
          name: r2-price-builds-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r2-verified-builds.json
            ${{ runner.temp }}/r2-legacy-inventory.json
          if-no-files-found: error
          retention-days: 7

  publish-firebase-backup:
    name: Publish and verify Firebase price backup
    needs: [publish-prices-to-r2, inventory-r2-price-builds]
    if: ${{ !cancelled() && needs.publish-prices-to-r2.outputs.origin_verified == 'true' && needs.inventory-r2-price-builds.result == 'success' }}
    runs-on: macos-15-intel
    timeout-minutes: 45
    environment: pokemon-catalog-production
    concurrency:
      group: scanstash-catalog-production-hosting
      cancel-in-progress: false
      queue: max
    env:
      R2_READ_ORIGIN: https://catalog-staging.scan-stash.com
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE_ID: ${{ secrets.FIREBASE_HOSTING_SITE_ID }}
    steps:
      - name: Require the verified primary price artifact and inventory
        env:
          PRICE_ARTIFACT: ${{ needs.publish-prices-to-r2.outputs.price_artifact }}
          INVENTORY_ARTIFACT: ${{ needs.inventory-r2-price-builds.outputs.inventory_artifact }}
        run: |
          if ! [[ "$PRICE_ARTIFACT" =~ ^[0-9]+$ && "$INVENTORY_ARTIFACT" =~ ^[0-9]+$ ]]; then
            echo '::error title=Firebase price backup::The verified R2 artifacts are unavailable.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/r2-catalog-cache
          key: r2-catalog-restore-v1-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-catalog-restore-v1-
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-prices-to-r2.outputs.price_artifact }}
          merge-multiple: true
          path: publisher/price-candidate
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.inventory-r2-price-builds.outputs.inventory_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/r2-price-inventory
      # Stage the complete validated replacement first. The restore script then
      # verifies these local prices instead of downloading the obsolete feed.
      - name: Validate and stage the prepared price namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import restore, NAMESPACE
          def no_network(*args, **kwargs):
              raise ValueError('The prepared artifact must be complete')
          source = Path('publisher/price-candidate/site')
          assert restore(source, fetch=no_network, require_fresh=True)
          destination = Path('publisher/site') / NAMESPACE
          if destination.exists():
              shutil.rmtree(destination)
          shutil.copytree(source / NAMESPACE, destination)
          PY
          bash scripts/verify_pokemon_catalog_hosting_config.sh
      - name: Restore verified R2 catalogs and retained builds alongside the R2 capture
        env:
          RECONCILE_CATALOG_HISTORY: ${{ inputs.reconcile_catalog_history == true }}
          PREFER_R2_PRICE_HISTORY: "true"
        run: |
          export CATALOG_RESTORE_CACHE_WORK="$RUNNER_TEMP/price-catalog-pointers"
          reconcile=()
          if [[ "$RECONCILE_CATALOG_HISTORY" == true ]]; then reconcile+=(--reconcile-history); fi
          python3 scripts/catalog_hosting_cache.py prepare --origin "$R2_READ_ORIGIN" --site publisher/site \
            --cache "$RUNNER_TEMP/r2-catalog-cache" --work "$CATALOG_RESTORE_CACHE_WORK" "${reconcile[@]}"
          bash scripts/restore_catalog_hosting_site.sh \
            "$CATALOG_RESTORE_CACHE_WORK/pokemon-current.json" \
            "$CATALOG_RESTORE_CACHE_WORK/magic-current.json" publisher/site \
            "$R2_READ_ORIGIN" PokemonCatalogCore Config/PokemonCatalogProduction.xcconfig \
            MagicCatalogCore Config/MagicCatalogProduction.xcconfig "$CATALOG_RESTORE_CACHE_WORK/one-piece-current.json" \
            OnePieceCatalogCore Config/OnePieceCatalogProduction.xcconfig "$CATALOG_RESTORE_CACHE_WORK/yugioh-current.json"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.35.1
      - name: Publish the complete preserved site
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_HOSTING_SITE_ID"
          service_account_file="$RUNNER_TEMP/firebase-production-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          firebase target:apply hosting production "$FIREBASE_HOSTING_SITE_ID" --project "$FIREBASE_PROJECT_ID"
          python3 scripts/catalog_hosting_cache.py confirm --origin "$R2_READ_ORIGIN" --site publisher/site \
            --work "$RUNNER_TEMP/price-catalog-pointers"
          python3 scripts/catalog_hosting_cache.py confirm-r2-scopes --site publisher/site
          python3 scripts/market_price_feeds.py check-catalog-scopes --site-root publisher/site \
            --prepared publisher/price-candidate/site
          python3 scripts/market_price_feeds.py check-publication-build --site-root publisher/site
          inventory="$RUNNER_TEMP/r2-price-inventory/r2-verified-builds.json"
          if [[ ! -f publisher/site/market-prices/v2/history.json ]]; then
            inventory="$RUNNER_TEMP/r2-price-inventory/r2-legacy-inventory.json"
          fi
          python3 -u scripts/market_price_rollback.py prepare --site-root publisher/site \
            --r2-inventory "$inventory" \
            --primary-pointer publisher/price-candidate/site/market-prices/v2/latest.json
          firebase deploy --only hosting:production --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Verify published bytes from the origin
        id: firebase-readback
        run: |
          python3 scripts/catalog_hosting_cache.py verify-firebase-catalogs --site publisher/site
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import (CATALOG_NAMESPACES, MAX_SCOPE_BYTES, NAMESPACE, ORIGIN,
                                         SCOPE_FILE, read_http, restore)
          destination = Path('publisher/price-readback')
          assert restore(destination, require_fresh=True)
          expected = Path('publisher/site') / NAMESPACE / 'index.json'
          assert (destination / NAMESPACE / 'index.json').read_bytes() == expected.read_bytes()
          for _, namespace in CATALOG_NAMESPACES.values():
              relative = Path(namespace) / SCOPE_FILE
              assert read_http(f'{ORIGIN}/{relative}', MAX_SCOPE_BYTES) == (Path('publisher/site') / relative).read_bytes()
          PY
          python3 -u scripts/market_price_rollback.py verify --site-root publisher/site
          python3 scripts/market_price_rollback.py confirm-primary --site-root publisher/site
          python3 scripts/catalog_hosting_cache.py confirm --origin "$R2_READ_ORIGIN" --site publisher/site \
            --work "$RUNNER_TEMP/price-catalog-pointers"
      - name: Verify continuous rollback readiness and report status
        env:
          FIREBASE_QUOTA_MODE: ${{ vars.FIREBASE_QUOTA_MODE }}
        run: |
          service_account_file="$(mktemp "$RUNNER_TEMP/firebase-readiness-sa.XXXXXX")"
          trap 'rm -f "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          python3 scripts/rollback_readiness.py \
            --r2-origin "$R2_READ_ORIGIN" \
            --firebase-origin https://scanstash-catalog-prod.web.app \
            --rollback-hostname catalog.scan-stash.com \
            --site-root publisher/site \
            --firebase-project "$FIREBASE_PROJECT_ID" \
            --firebase-site "$FIREBASE_HOSTING_SITE_ID" \
            --service-account "$service_account_file" \
            --quota-mode "${FIREBASE_QUOTA_MODE:-strict}" \
            --report "$RUNNER_TEMP/rollback-readiness.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload rollback readiness report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: price-rollback-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-readiness.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Seal the verified R2 catalog tree for the next backup
        id: catalog-cache
        continue-on-error: true
        run: |
          key=$(python3 scripts/catalog_hosting_cache.py seal --site publisher/site \
            --cache "$RUNNER_TEMP/r2-catalog-cache" --work "$RUNNER_TEMP/price-catalog-pointers")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.catalog-cache.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/r2-catalog-cache
          key: r2-catalog-restore-v1-${{ steps.catalog-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report a failed backup separately from the primary publication
        if: failure()
        run: |
          echo '::warning title=Firebase price backup failed::Rollback target marked NOT READY. The verified R2 price publication remains active.'
          echo '**Rollback readiness: NOT READY** — Firebase backup failed. The verified R2 price publication remains active.' >> "$GITHUB_STEP_SUMMARY"
