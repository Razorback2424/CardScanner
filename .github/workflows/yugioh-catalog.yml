name: YuGiOh catalog candidate
on:
  workflow_dispatch:
    inputs:
      publish_prices:
        description: "Publish the validated daily price feeds (does not activate a catalog)"
        type: boolean
        default: false
  schedule:
    - cron: "23 1,7,13,19 * * *"
permissions:
  contents: read
jobs:
  ingest-candidate:
    runs-on: macos-15-intel
    timeout-minutes: 45
    concurrency:
      group: scanstash-tcgcsv-daily-ingestion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Test evidence admission
        run: python3 -I scripts/build_yugioh_catalog.py --self-test
      - name: Build and test the standalone publisher
        run: |
          bash scripts/build_yugioh_publisher.sh "$RUNNER_TEMP/yugioh-publisher"
          YUGIOH_CATALOG_PUBLISHER="$RUNNER_TEMP/yugioh-publisher" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_yugioh_publisher.py
      - name: Test daily price contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_market_price_feeds.py
      - name: Identify the upstream daily build
        id: upstream
        run: |
          mkdir -p "$RUNNER_TEMP/yugioh-source"
          curl --fail --proto '=https' --tlsv1.2 --max-filesize 1024 --max-time 45 \
            --user-agent 'ScanStashPricePublisher/1.0' \
            https://tcgcsv.com/last-updated.txt -o "$RUNNER_TEMP/yugioh-source/source-build-start.txt"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import instant, stamp
          raw = (Path(os.environ['RUNNER_TEMP']) / 'yugioh-source/source-build-start.txt').read_bytes()
          assert instant(raw.decode().strip()) <= instant(stamp())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('build_hash=' + hashlib.sha256(raw).hexdigest() + '\n')
          PY
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/yugioh-source
            ${{ runner.temp }}/market-price-source
          key: tcgcsv-daily-${{ steps.upstream.outputs.build_hash }}
      - name: Resolve the latest verified approved parent
        env:
          APPROVED_PARENT_URL: ${{ vars.YUGIOH_APPROVED_PARENT_URL }}
        run: |
          if [ -z "$APPROVED_PARENT_URL" ]; then
            echo "No production YGO approval endpoint is configured; bootstrap candidate only"
            echo "YUGIOH_PREVIOUS_SEED=TradingCardScanner/YuGiOhCatalogSeed/catalog.json" >> "$GITHUB_ENV"
            exit 0
          fi
          case "$APPROVED_PARENT_URL" in
            https://scanstash-catalog-prod.web.app/yugioh/v1/current.json|https://catalog.scan-stash.com/yugioh/v1/current.json) ;;
            *) echo "Unapproved parent origin/path" >&2; exit 1 ;;
          esac
          curl --fail --proto '=https' --tlsv1.2 --max-filesize 68157440 --max-time 60 \
            "$APPROVED_PARENT_URL" -o "$RUNNER_TEMP/yugioh-approved-parent.json"
          "$RUNNER_TEMP/yugioh-publisher" export-parent --input "$RUNNER_TEMP/yugioh-approved-parent.json" \
            --keys Config/YuGiOhCatalogProduction.keys.json --output "$RUNNER_TEMP/yugioh-approved-parent-catalog.json"
          echo "YUGIOH_PREVIOUS_SEED=$RUNNER_TEMP/yugioh-approved-parent-catalog.json" >> "$GITHUB_ENV"
      - name: Ingest once on the server and stage a candidate
        shell: bash
        run: |
          calendar="$RUNNER_TEMP/yugioh-release-calendar.html"
          calendar_args=()
          if curl --fail --proto '=https' --tlsv1.2 --retry 2 --max-filesize 4000000 --max-time 35 \
            'https://www.db.yugioh-card.com/yugiohdb/card_list.action?wname=CardSearch&request_locale=en' -o "$calendar"; then
            if python3 scripts/yugioh_official_inventory.py "$calendar" "$RUNNER_TEMP/verified-release-calendar.json"; then
              calendar_args+=(--release-calendar-html "$calendar")
            fi
          fi
          if [ "${#calendar_args[@]}" -eq 0 ]; then
            echo '::warning title=Yu-Gi-Oh! release calendar::Fresh Konami directory unavailable. Using the checked-in capture.'
          fi
          python3 -I scripts/build_yugioh_catalog.py \
            --cache-dir "$RUNNER_TEMP/yugioh-source" \
            --previous-seed "$YUGIOH_PREVIOUS_SEED" \
            --out "$RUNNER_TEMP/yugioh/catalog.json" \
            --report "$RUNNER_TEMP/yugioh/build-report.md" \
            --check-recent-official-releases \
            --hosting-root "$RUNNER_TEMP/yugioh/site" \
            --publication-revision "${{ github.run_number }}" "${calendar_args[@]}"
      - name: Bind the completed capture to the same upstream build
        run: |
          curl --fail --proto '=https' --tlsv1.2 --max-filesize 1024 --max-time 45 \
            --user-agent 'ScanStashPricePublisher/1.0' \
            https://tcgcsv.com/last-updated.txt -o "$RUNNER_TEMP/yugioh-source/source-build-end.txt"
          cmp "$RUNNER_TEMP/yugioh-source/source-build-start.txt" "$RUNNER_TEMP/yugioh-source/source-build-end.txt"
      - name: Verify the active One Piece pricing scope
        run: |
          python3 - "$RUNNER_TEMP/one-piece-price-scope.json" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from market_price_feeds import ORIGIN, read_http

          data = read_http(f'{ORIGIN}/one-piece/v1/current.json', 48 * 1024 * 1024, absent_ok=True)
          if data is None:
              data = Path('TradingCardScanner/OnePieceCatalogSeed/one-piece-catalog-release.json').read_bytes()
          Path(sys.argv[1]).write_bytes(data)
          PY
          python3 scripts/one_piece_pinned_keys.py Config/OnePieceCatalogProduction.xcconfig "$RUNNER_TEMP/one-piece-app-pins.json"
          swift run --package-path OnePieceCatalogCore one-piece-catalog-publisher verify-hosted-release \
            --input "$RUNNER_TEMP/one-piece-price-scope.json" --trusted-keys "$RUNNER_TEMP/one-piece-app-pins.json"
      - name: Prepare scoped prices using the same YGO capture
        run: >-
          python3 scripts/market_price_feeds.py prepare
          --cache-dir "${RUNNER_TEMP}/market-price-source"
          --yugioh-source "${RUNNER_TEMP}/yugioh-source"
          --verified-one-piece-envelope "${RUNNER_TEMP}/one-piece-price-scope.json"
          --site-root "${RUNNER_TEMP}/price-candidate/site"
          --report "${RUNNER_TEMP}/price-candidate/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: market-price-feeds
          path: ${{ runner.temp }}/price-candidate
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: yugioh-catalog-candidate
          path: ${{ runner.temp }}/yugioh
          retention-days: 7
      - name: Retain catalog diagnostics when staging fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yugioh-catalog-diagnostics
          path: |
            ${{ runner.temp }}/yugioh/build-report.md
            ${{ runner.temp }}/yugioh/build-report.coverage.json
            ${{ runner.temp }}/yugioh/build-report.exclusions.json
          if-no-files-found: ignore
          retention-days: 7
      # Catalog candidates remain separate from the price-only publication below.

  publish-prices:
    needs: ingest-candidate
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_prices == true) ||
       (github.event_name == 'schedule' && vars.MARKET_PRICE_FEEDS_ACTIVE == 'true'))
    runs-on: macos-15-intel
    timeout-minutes: 30
    environment: pokemon-catalog-production
    concurrency:
      group: scanstash-catalog-production-hosting
      cancel-in-progress: false
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE_ID: ${{ secrets.FIREBASE_HOSTING_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: market-price-feeds
          path: publisher/price-candidate
      # Stage the complete validated replacement first. The restore script then
      # verifies these local prices instead of downloading the obsolete feed.
      - name: Validate and stage the prepared price namespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import restore, NAMESPACE
          def no_network(*args, **kwargs):
              raise ValueError('The prepared artifact must be complete')
          source = Path('publisher/price-candidate/site')
          assert restore(source, fetch=no_network, require_fresh=True)
          destination = Path('publisher/site') / NAMESPACE
          if destination.exists():
              shutil.rmtree(destination)
          shutil.copytree(source / NAMESPACE, destination)
          PY
          bash scripts/verify_pokemon_catalog_hosting_config.sh
      - name: Restore every existing catalog alongside the prepared prices
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.error import HTTPError
          import os, sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import read_http, ORIGIN
          root = Path(os.environ['RUNNER_TEMP']) / 'price-catalog-pointers'
          root.mkdir(parents=True, exist_ok=True)
          for name, namespace in [('pokemon', 'v1'), ('magic', 'magic/v1')]:
              path = root / (name + '-current.json')
              try:
                  raw = read_http(ORIGIN + '/' + namespace + '/current.json', 68 * 1024 * 1024, absent_ok=name == 'magic')
              except HTTPError as error:
                  if name == 'pokemon' and error.code == 404:
                      sys.exit('::error::Production pointer v1/current.json is missing; restore the last verified Pokémon release before deploying the shared site.')
                  raise
              if raw is None:
                  path.unlink(missing_ok=True)
              else:
                  path.write_bytes(raw)
          PY
          bash scripts/restore_catalog_hosting_site.sh \
            "$RUNNER_TEMP/price-catalog-pointers/pokemon-current.json" \
            "$RUNNER_TEMP/price-catalog-pointers/magic-current.json" publisher/site \
            https://scanstash-catalog-prod.web.app
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.35.1
      - name: Publish the complete preserved site
        run: |
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_HOSTING_SITE_ID"
          service_account_file="$RUNNER_TEMP/firebase-production-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          firebase target:apply hosting production "$FIREBASE_HOSTING_SITE_ID" --project "$FIREBASE_PROJECT_ID"
          firebase deploy --only hosting:production --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Verify published bytes from the origin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import restore, NAMESPACE
          destination = Path('publisher/price-readback')
          assert restore(destination, require_fresh=True)
          expected = Path('publisher/site') / NAMESPACE / 'index.json'
          assert (destination / NAMESPACE / 'index.json').read_bytes() == expected.read_bytes()
          PY
