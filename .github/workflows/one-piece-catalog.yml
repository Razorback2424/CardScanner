name: One Piece catalog

on:
  schedule:
    - cron: '21 10 * * 1'
  pull_request:
    paths:
      - "OnePieceCatalogCore/**"
      - "Config/OnePieceCatalogProduction.xcconfig"
      - "scripts/normalize_one_piece_sources.py"
      - "scripts/build_one_piece_catalog.py"
      - "scripts/one_piece_pinned_keys.py"
      - "scripts/prepare_one_piece_hosting.py"
      - "scripts/tests/test_one_piece_hosting.py"
      - "scripts/tests/test_one_piece_pinned_keys.py"
      - "scripts/one_piece_tcgcsv_capture.py"
      - "scripts/reconcile_one_piece_tcgcsv_sources.py"
      - "scripts/reconcile_one_piece_launch_products.py"
      - "scripts/review_one_piece_base_market_mappings.py"
      - "scripts/tests/test_one_piece_base_market_mappings.py"
      - "scripts/capture_one_piece_products.py"
      - "scripts/discover_one_piece_products.py"
      - "scripts/audit_one_piece_coverage.py"
      - "scripts/tests/test_one_piece_coverage.py"
      - "scripts/reconcile_one_piece_fixed_foil_products.py"
      - "scripts/reconcile_one_piece_retail_printings.py"
      - "scripts/one_piece_eb05_retail.py"
      - "scripts/tests/test_one_piece_fixed_foil_products.py"
      - "scripts/tests/test_one_piece_retail_printings.py"
      - "publisher/one-piece/production/revision-2/fixed-foil-products.json"
      - "scripts/tests/test_one_piece_product_discovery.py"
      - "scripts/tests/test_one_piece_product_pipeline.py"
      - "scripts/tests/test_one_piece_tcgcsv_catalog.py"
      - "scripts/tests/test_normalize_one_piece_sources.py"
      - ".github/workflows/one-piece-catalog.yml"
      - "Config/Cloudflare/catalog-cache-rules.json"
      - "firebase.json"
      - "scripts/restore_catalog_hosting_site.sh"
      - "scripts/catalog_hosting_cache.py"
      - "scripts/cloudflare_cache.py"
      - "scripts/r2_catalog_publish.py"
      - "scripts/verify_hosting_cache.py"
      - "scripts/market_price_feeds.py"
      - "scripts/market_price_rollback.py"
      - "scripts/verify_pokemon_catalog_hosting_config.sh"
      - "scripts/tests/test_catalog_hosting_restore.py"
      - "scripts/tests/test_catalog_hosting_cache.py"
      - "scripts/tests/test_cloudflare_cache.py"
      - "scripts/tests/test_r2_catalog_publish.py"
      - "scripts/tests/test_market_price_rollback.py"
      - "scripts/prepare_one_piece_acceptance_samples.py"
      - "scripts/tests/test_one_piece_acceptance_samples.py"
      - "scripts/tests/test_one_piece_workflow.py"
      - "scripts/publish_one_piece_local.py"
      - "scripts/tests/test_publish_one_piece_local.py"
      - "scripts/catalog_release_preflight.py"
      - "scripts/tests/test_catalog_release_preflight.py"
      - "scripts/catalog_exceptions.py"
      - "scripts/tests/test_catalog_exceptions.py"
  workflow_dispatch:
    inputs:
      audit:
        description: "Compare the signed catalog to the current official English card lists"
        type: boolean
        default: false
      sign:
        description: "Prepare a signed artifact (does not deploy)"
        type: boolean
        default: false
      candidate:
        description: "Reviewed canonical payload path in this repository"
        type: string
      reviewed_sha256:
        description: "SHA-256 of the exact reviewed payload bytes"
        type: string
      previous:
        description: "Previous verified envelope path; required after bootstrap"
        type: string
      bootstrap:
        description: "Explicit first publication at revision one"
        type: boolean
        default: false
      publish:
        description: "Publish an already signed One Piece artifact"
        type: boolean
        default: false
      signed_run_id:
        description: "Run ID that signed and verified the reviewed artifact"
        type: string
      reviewed_envelope_sha256:
        description: "SHA-256 of the reviewed signed envelope"
        type: string
      reviewed_manifest_sha256:
        description: "SHA-256 of the reviewed verified manifest"
        type: string

permissions:
  contents: read

jobs:
  coverage-report:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.audit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compare the verified catalog with Bandai's current inventory
        shell: bash
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/one-piece-coverage"
          mkdir -p "$audit"
          python3 - "$audit/current.json" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from market_price_feeds import R2_ORIGIN, read_http

          data = read_http(f'{R2_ORIGIN}/one-piece/v1/current.json', 64 * 1024 * 1024, absent_ok=True)
          if data is None:
              print('Hosted One Piece catalog returned 404. Auditing the bundled seed.')
              data = Path('TradingCardScanner/OnePieceCatalogSeed/one-piece-catalog-release.json').read_bytes()
          Path(sys.argv[1]).write_bytes(data)
          PY
          python3 scripts/one_piece_pinned_keys.py Config/OnePieceCatalogProduction.xcconfig "$audit/keys.json"
          swift run --package-path OnePieceCatalogCore one-piece-catalog-publisher verify-hosted-release \
            --input "$audit/current.json" --trusted-keys "$audit/keys.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_one_piece_coverage.py \
            --capture-root "$audit/source" --release "$audit/current.json" --output "$audit/coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: one-piece-official-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/one-piece-coverage/coverage.json
          if-no-files-found: error

  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Reject a combined sign and publish request
        if: github.event_name == 'workflow_dispatch' && inputs.sign && inputs.publish
        run: |
          echo "::error::Publish an artifact from a completed signing run."
          exit 1
      - uses: actions/checkout@v4
      - name: Validate hosting cache rules and namespace restoration
        run: |
          bash scripts/verify_pokemon_catalog_hosting_config.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_catalog_hosting_restore.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_hosting.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_acceptance_samples.py -v
      - name: Test bounded source normalization
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_normalize_one_piece_sources.py -v
      - name: Test retained TCGCSV capture and catalog builder
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_tcgcsv_catalog.py -v
      - name: Test reviewed product reconciliation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_product_pipeline.py -v
      - name: Test complete ordinary-product discovery
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_product_discovery.py -v
      - name: Test official coverage comparison and read-only discovery
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_coverage.py -v
      - name: Test fixed product finish and exact retailer artwork evidence
        run: |
          python3 -m venv "$RUNNER_TEMP/one-piece-image-tests"
          "$RUNNER_TEMP/one-piece-image-tests/bin/python" -m pip install Pillow==11.3.0
          for tests in test_one_piece_fixed_foil_products.py test_one_piece_retail_printings.py; do
            PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/one-piece-image-tests/bin/python" \
              -m unittest discover -s scripts/tests -p "$tests" -v
          done
      - name: Test exact base market mapping review
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_base_market_mappings.py -v
      - name: Test app trust anchor export
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_pinned_keys.py -v
      - name: Test workflow verification and scheduling boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_workflow.py -v
      - name: Test local publication safeguards
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_publish_one_piece_local.py -v
      - name: Test catalog size preflight and exceptions ledger
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_catalog_release_preflight.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_catalog_exceptions.py -v

  validate-catalog-core:
    if: github.event_name != 'schedule'
    # Linux: hosted macOS runners are often unavailable. swift-crypto matches CryptoKit.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test catalog core and publisher CLI
        run: swift test --package-path OnePieceCatalogCore

  sign-reviewed-artifact:
    needs: [validate, validate-catalog-core]
    if: github.event_name == 'workflow_dispatch' && inputs.sign == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: one-piece-catalog-signing
    env:
      KEY_ID: ${{ vars.ONE_PIECE_CATALOG_KEY_ID }}
      CANDIDATE: ${{ inputs.candidate }}
      REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
      PREVIOUS: ${{ inputs.previous }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and independently verify the reviewed envelope
        env:
          ONE_PIECE_CATALOG_SIGNING_KEY: ${{ secrets.ONE_PIECE_CATALOG_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_ID"
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path.cwd().resolve()
          for name in ("CANDIDATE", "PREVIOUS"):
              value = os.environ.get(name, "")
              if value:
                  path = pathlib.Path(value).resolve(strict=True)
                  path.relative_to(root)
                  if not path.is_file():
                      raise ValueError("Publication inputs must be repository files")
          PY
          artifact_root="$RUNNER_TEMP/one-piece-signed-artifact"
          mkdir -p "$artifact_root"
          trusted_keys="$RUNNER_TEMP/one-piece-app-pinned-keys.json"
          python3 scripts/one_piece_pinned_keys.py Config/OnePieceCatalogProduction.xcconfig "$trusted_keys"
          baseline=()
          if [ "$BOOTSTRAP" = true ]; then
            test -z "$PREVIOUS"
            baseline+=(--bootstrap-registry yes)
          else
            test -n "$PREVIOUS"
            baseline+=(--previous "$PREVIOUS")
          fi
          python3 scripts/catalog_release_preflight.py --game one-piece --payload "$CANDIDATE"
          swift run --package-path OnePieceCatalogCore one-piece-catalog-publisher sign \
            --input "$CANDIDATE" --trusted-keys "$trusted_keys" --key-id "$KEY_ID" \
            --reviewed-payload-sha256 "$REVIEWED_SHA256" "${baseline[@]}" \
            --output "$artifact_root/release-envelope.json" --manifest "$artifact_root/manifest.json"
          swift run --skip-build --package-path OnePieceCatalogCore one-piece-catalog-publisher verify \
            --input "$artifact_root/release-envelope.json" --trusted-keys "$trusted_keys" \
            --reviewed-payload-sha256 "$REVIEWED_SHA256" "${baseline[@]}" \
            --manifest "$artifact_root/verified-manifest.json"
          cmp "$artifact_root/manifest.json" "$artifact_root/verified-manifest.json"
          python3 scripts/catalog_release_preflight.py --game one-piece --envelope "$artifact_root/release-envelope.json"
      - uses: actions/upload-artifact@v4
        with:
          name: one-piece-signed-artifact-${{ github.run_id }}
          path: ${{ runner.temp }}/one-piece-signed-artifact/
          if-no-files-found: error
          retention-days: 30

  publish-reviewed-artifact:
    name: Verify and stage One Piece catalog
    needs: [validate, validate-catalog-core]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: one-piece-catalog-production
    permissions:
      actions: read
      contents: read
    outputs:
      catalog_artifact: ${{ steps.share-catalog.outputs.artifact-id }}
      revision: ${{ steps.stage.outputs.revision }}
    env:
      R2_READ_ORIGIN: https://catalog-staging.scan-stash.com
      SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
      REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
      REVIEWED_ENVELOPE_SHA256: ${{ inputs.reviewed_envelope_sha256 }}
      REVIEWED_MANIFEST_SHA256: ${{ inputs.reviewed_manifest_sha256 }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the reviewed signing run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SIGNED_RUN_ID" =~ ^[0-9]+$ ]]
          for digest in "$REVIEWED_SHA256" "$REVIEWED_ENVELOPE_SHA256" "$REVIEWED_MANIFEST_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_RUN_ID" | jq -e '
            .path == ".github/workflows/one-piece-catalog.yml" and
            .head_branch == "main" and .event == "workflow_dispatch" and .conclusion == "success"
          '
      - uses: actions/download-artifact@v4
        with:
          name: one-piece-signed-artifact-${{ inputs.signed_run_id }}
          path: ${{ runner.temp }}/one-piece-reviewed-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signed_run_id }}
      - name: Verify the reviewed artifact against R2 and stage it
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/one-piece-reviewed-artifact"
          envelope="$artifact/release-envelope.json"
          printf '%s  %s\n' \
            "$REVIEWED_ENVELOPE_SHA256" "$envelope" \
            "$REVIEWED_MANIFEST_SHA256" "$artifact/verified-manifest.json" | shasum -a 256 -c -
          inputs="$RUNNER_TEMP/one-piece-hosting-inputs"
          revision=$(python3 scripts/prepare_one_piece_hosting.py --artifact "$artifact" \
            --output-dir "$inputs" --bootstrap "$BOOTSTRAP" --origin "$R2_READ_ORIGIN" --one-piece-only)
          if [ "$BOOTSTRAP" = true ]; then
            baseline=(--bootstrap-registry yes)
          else
            baseline=(--previous "$inputs/one-piece-predecessor.json")
          fi
          trusted_keys="$RUNNER_TEMP/one-piece-app-pinned-keys.json"
          python3 scripts/one_piece_pinned_keys.py Config/OnePieceCatalogProduction.xcconfig "$trusted_keys"
          swift run --package-path OnePieceCatalogCore one-piece-catalog-publisher verify \
            --input "$envelope" --trusted-keys "$trusted_keys" \
            --reviewed-payload-sha256 "$REVIEWED_SHA256" "${baseline[@]}" \
            --manifest "$RUNNER_TEMP/one-piece-verified-manifest.json"
          cmp "$RUNNER_TEMP/one-piece-verified-manifest.json" "$artifact/verified-manifest.json"
          rm -rf publisher/r2-catalog-candidate
          destination=publisher/r2-catalog-candidate/site/one-piece/v1
          immutable="$destination/releases/$revision/catalog-release.json"
          mkdir -p "$(dirname "$immutable")"
          cp "$envelope" "$immutable"
          cp "$envelope" "$destination/current.json"
          python3 scripts/market_price_feeds.py write-catalog-scopes \
            --site-root publisher/r2-catalog-candidate/site --game one-piece
          metadata_args=()
          if [ "$BOOTSTRAP" != true ]; then
            previous_revision="$(jq -er .previousRevision "$artifact/verified-manifest.json")"
            metadata_args+=(--previous-revision "$previous_revision" --previous-pointer "$inputs/one-piece-predecessor.json")
          fi
          python3 scripts/r2_catalog_publish.py \
            --site publisher/r2-catalog-candidate/site \
            --write-catalog-metadata publisher/r2-catalog-candidate/catalog-publish-metadata.json \
            --namespace one-piece/v1 --revision "$revision" "${metadata_args[@]}"
          bash scripts/verify_pokemon_catalog_hosting_config.sh
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Hand off the verified One Piece release to R2
        id: share-catalog
        uses: actions/upload-artifact@v4
        with:
          name: one-piece-r2-catalog-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: publisher/r2-catalog-candidate
          if-no-files-found: error
          retention-days: 7

  publish-r2-catalog:
    name: Publish and verify primary R2 One Piece catalog
    needs: publish-reviewed-artifact
    if: ${{ !cancelled() && needs.publish-reviewed-artifact.result == 'success' && needs.publish-reviewed-artifact.outputs.catalog_artifact != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: r2-catalog-production
    concurrency:
      group: scanstash-catalog-r2-hosting
      cancel-in-progress: false
      queue: max
    outputs:
      origin_verified: ${{ steps.publish.outputs.origin_verified }}
      cache_verified: ${{ steps.publish.outputs.cache_verified }}
      inventory_artifact: ${{ steps.share-inventory.outputs.artifact-id }}
    steps:
      - name: Require the staged One Piece artifact
        env:
          ARTIFACT_ID: ${{ needs.publish-reviewed-artifact.outputs.catalog_artifact }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo 'The staged One Piece catalog artifact could not be handed off to R2.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-reviewed-artifact.outputs.catalog_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/one-piece-r2-catalog
      - name: Publish immutable release, price scope, pointer and verify Cloudflare cache
        id: publish
        env:
          PYTHONUNBUFFERED: "1"
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_CACHE_ENFORCE: ${{ vars.CLOUDFLARE_CACHE_ENFORCE }}
          REVISION: ${{ needs.publish-reviewed-artifact.outputs.revision }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in r2-catalog-production}"
          : "${AWS_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in r2-catalog-production}"
          set +e
          python3 scripts/r2_catalog_publish.py \
            --primary-catalog one-piece/v1 \
            --catalog-metadata "$RUNNER_TEMP/one-piece-r2-catalog/catalog-publish-metadata.json" \
            --site "$RUNNER_TEMP/one-piece-r2-catalog/site" \
            --public-base https://catalog-staging.scan-stash.com \
            --cache-report "$RUNNER_TEMP/one-piece-cache-verification.json" \
            --verify-all
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 2 ]]; then
            exit "$rc"
          fi
          echo "origin_verified=true" >> "$GITHUB_OUTPUT"
          cache_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["cacheStatus"])' "$RUNNER_TEMP/one-piece-cache-verification.json")"
          echo "cache_verified=$cache_status" >> "$GITHUB_OUTPUT"
          echo "Origin verification (nonce-based) passed for One Piece revision $REVISION on R2. Client-visible cache verification: $cache_status. Firebase backup reports separately." >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory R2 price builds for Firebase backup
        id: inventory
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [[ "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]
          : "${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in r2-catalog-production}"
          list_r2=(aws --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            --cli-connect-timeout 10 --cli-read-timeout 60 --no-cli-pager --output json
            s3api list-objects-v2 --bucket "$R2_BUCKET_NAME")
          "${list_r2[@]}" --prefix market-prices/v2/verified-builds/ --query 'Contents[].Key' \
            > "$RUNNER_TEMP/r2-verified-builds.json"
          "${list_r2[@]}" --prefix market-prices/v2/builds/ --delimiter / --query 'CommonPrefixes[].Prefix' \
            > "$RUNNER_TEMP/r2-legacy-inventory.json"
      - name: Share R2 price inventory for Firebase backup
        if: steps.inventory.outcome == 'success'
        id: share-inventory
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: one-piece-r2-price-builds-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/r2-verified-builds.json
            ${{ runner.temp }}/r2-legacy-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce client-visible cache verification status
        if: steps.publish.outputs.cache_verified != 'passed'
        env:
          CACHE_STATUS: ${{ steps.publish.outputs.cache_verified }}
        run: |
          if [[ "$CACHE_STATUS" == "failed" ]]; then
            echo '::error title=Cloudflare cache verification failed::One Piece R2 origin publication is active, but purge or canonical verification failed. Not eligible for Stage 2 cutover readiness until recovered.'
            exit 1
          fi
          echo '::warning title=Cloudflare cache verification skipped::Configure CLOUDFLARE_ZONE_ID and CLOUDFLARE_CACHE_PURGE_TOKEN in r2-catalog-production for Stage 2 cache readiness.'

  backup-firebase-catalog:
    name: Back up verified R2 site to Firebase
    needs: [publish-reviewed-artifact, publish-r2-catalog]
    if: ${{ !cancelled() && needs.publish-r2-catalog.outputs.origin_verified == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    environment: pokemon-catalog-production
    concurrency:
      group: scanstash-catalog-production-hosting
      cancel-in-progress: false
      queue: max
    env:
      R2_READ_ORIGIN: https://catalog-staging.scan-stash.com
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE_ID: ${{ secrets.FIREBASE_HOSTING_SITE_ID }}
      REVISION: ${{ needs.publish-reviewed-artifact.outputs.revision }}
    steps:
      - name: Require the R2 price build inventory
        env:
          INVENTORY_ARTIFACT: ${{ needs.publish-r2-catalog.outputs.inventory_artifact }}
        run: |
          if [[ ! "$INVENTORY_ARTIFACT" =~ ^[0-9]+$ ]]; then
            echo '::error title=Firebase catalog backup::The R2 price build inventory is unavailable.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/r2-catalog-cache
          key: r2-catalog-restore-v1-probe-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: r2-catalog-restore-v1-
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-r2-catalog.outputs.inventory_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/r2-price-inventory
      - name: Restore the complete verified site from R2
        env:
          PREFER_R2_PRICE_HISTORY: "true"
        shell: bash
        run: |
          set -euo pipefail
          export CATALOG_RESTORE_CACHE_WORK="$RUNNER_TEMP/r2-catalog-pointers"
          python3 scripts/catalog_hosting_cache.py prepare --origin "$R2_READ_ORIGIN" \
            --site publisher/site --cache "$RUNNER_TEMP/r2-catalog-cache" --work "$CATALOG_RESTORE_CACHE_WORK"
          bash scripts/restore_catalog_hosting_site.sh \
            "$CATALOG_RESTORE_CACHE_WORK/pokemon-current.json" \
            "$CATALOG_RESTORE_CACHE_WORK/magic-current.json" publisher/site "$R2_READ_ORIGIN" \
            PokemonCatalogCore Config/PokemonCatalogProduction.xcconfig \
            MagicCatalogCore Config/MagicCatalogProduction.xcconfig \
            "$CATALOG_RESTORE_CACHE_WORK/one-piece-current.json" \
            OnePieceCatalogCore Config/OnePieceCatalogProduction.xcconfig \
            "$CATALOG_RESTORE_CACHE_WORK/yugioh-current.json"
          test -f "publisher/site/one-piece/v1/releases/$REVISION/catalog-release.json"
          bash scripts/verify_pokemon_catalog_hosting_config.sh
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.35.1
      - name: Confirm R2 parity and deploy Firebase backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          test "$FIREBASE_PROJECT_ID" = scanstash-catalog-prod
          test "$FIREBASE_HOSTING_SITE_ID" = scanstash-catalog-prod
          service_account_file="$(mktemp "$RUNNER_TEMP/firebase-one-piece-service-account.XXXXXX")"
          trap 'rm -f "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          firebase target:apply hosting production "$FIREBASE_HOSTING_SITE_ID" --project "$FIREBASE_PROJECT_ID"
          python3 scripts/catalog_hosting_cache.py confirm --origin "$R2_READ_ORIGIN" \
            --site publisher/site --work "$RUNNER_TEMP/r2-catalog-pointers"
          python3 scripts/catalog_hosting_cache.py confirm-r2-scopes --site publisher/site
          inventory="$RUNNER_TEMP/r2-price-inventory/r2-verified-builds.json"
          if [[ ! -f publisher/site/market-prices/v2/history.json ]]; then
            inventory="$RUNNER_TEMP/r2-price-inventory/r2-legacy-inventory.json"
          fi
          python3 -u scripts/market_price_rollback.py sync-r2 --site-root publisher/site --r2-inventory "$inventory" \
            --state-file "$RUNNER_TEMP/firebase-v2-deploy-state.json"
          firebase deploy --only hosting:production --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Verify live catalog bytes and cache headers
        shell: bash
        run: |
          set -euo pipefail
          service_account_file="$(mktemp "$RUNNER_TEMP/firebase-verify-sa.XXXXXX")"
          trap 'rm -f "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          python3 scripts/catalog_hosting_cache.py verify-firebase-catalogs \
            --site publisher/site --namespace one-piece/v1 --revision "$REVISION"
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from market_price_feeds import NAMESPACE, restore
          destination = Path('publisher/price-readback')
          assert restore(destination, require_fresh=False, require_present=True)
          expected = Path('publisher/site') / NAMESPACE / 'index.json'
          assert (destination / NAMESPACE / 'index.json').read_bytes() == expected.read_bytes()
          PY
          python3 -u scripts/market_price_rollback.py verify --site-root publisher/site \
            --state-file "$RUNNER_TEMP/firebase-v2-deploy-state.json" \
            --firebase-site "$FIREBASE_HOSTING_SITE_ID" \
            --service-account "$service_account_file"
          python3 scripts/market_price_rollback.py confirm-primary --site-root publisher/site
          python3 scripts/catalog_hosting_cache.py confirm --origin "$R2_READ_ORIGIN" \
            --site publisher/site --work "$RUNNER_TEMP/r2-catalog-pointers"
      - name: Seal the verified R2 catalog cache
        id: catalog-cache
        continue-on-error: true
        run: |
          key=$(python3 scripts/catalog_hosting_cache.py seal --site publisher/site \
            --cache "$RUNNER_TEMP/r2-catalog-cache" --work "$RUNNER_TEMP/r2-catalog-pointers")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: steps.catalog-cache.outputs.key != ''
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/r2-catalog-cache
          key: r2-catalog-restore-v1-${{ steps.catalog-cache.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify continuous rollback readiness and report status
        env:
          FIREBASE_QUOTA_MODE: ${{ vars.FIREBASE_QUOTA_MODE }}
          FIREBASE_STORAGE_LIMIT_BYTES: ${{ vars.FIREBASE_STORAGE_LIMIT_BYTES }}
          FIREBASE_DAILY_BANDWIDTH_LIMIT_BYTES: ${{ vars.FIREBASE_DAILY_BANDWIDTH_LIMIT_BYTES }}
          FIREBASE_MONTHLY_BANDWIDTH_LIMIT_BYTES: ${{ vars.FIREBASE_MONTHLY_BANDWIDTH_LIMIT_BYTES }}
          FIREBASE_STAGED_SITE_LIMIT_BYTES: ${{ vars.FIREBASE_STAGED_SITE_LIMIT_BYTES }}
          FIREBASE_MIN_HEADROOM_RATIO: ${{ vars.FIREBASE_MIN_HEADROOM_RATIO }}
        shell: bash
        run: |
          set -euo pipefail
          service_account_file="$(mktemp "$RUNNER_TEMP/firebase-readiness-sa.XXXXXX")"
          trap 'rm -f "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          python3 scripts/rollback_readiness.py \
            --r2-origin "$R2_READ_ORIGIN" \
            --firebase-origin https://scanstash-catalog-prod.web.app \
            --rollback-hostname catalog.scan-stash.com \
            --site-root publisher/site \
            --firebase-project "$FIREBASE_PROJECT_ID" \
            --firebase-site "$FIREBASE_HOSTING_SITE_ID" \
            --service-account "$service_account_file" \
            --quota-mode "${FIREBASE_QUOTA_MODE:-advisory}" \
            --report "$RUNNER_TEMP/rollback-readiness.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload rollback readiness report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: one-piece-rollback-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rollback-readiness.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Report a failed backup separately from the primary publication
        if: failure()
        run: |
          echo '::warning title=Firebase One Piece catalog backup failed::Rollback target marked NOT READY. The verified R2 catalog publication remains active.'
          echo '**Rollback readiness: NOT READY** — Firebase backup failed. The verified R2 One Piece catalog publication remains active.' >> "$GITHUB_STEP_SUMMARY"
