name: One Piece catalog

on:
  schedule:
    - cron: '21 10 * * 1'
  pull_request:
    paths:
      - "OnePieceCatalogCore/**"
      - "Config/OnePieceCatalogProduction.xcconfig"
      - "scripts/normalize_one_piece_sources.py"
      - "scripts/build_one_piece_catalog.py"
      - "scripts/one_piece_pinned_keys.py"
      - "scripts/prepare_one_piece_hosting.py"
      - "scripts/tests/test_one_piece_hosting.py"
      - "scripts/tests/test_one_piece_pinned_keys.py"
      - "scripts/one_piece_tcgcsv_capture.py"
      - "scripts/reconcile_one_piece_tcgcsv_sources.py"
      - "scripts/reconcile_one_piece_launch_products.py"
      - "scripts/review_one_piece_base_market_mappings.py"
      - "scripts/tests/test_one_piece_base_market_mappings.py"
      - "scripts/capture_one_piece_products.py"
      - "scripts/discover_one_piece_products.py"
      - "scripts/audit_one_piece_coverage.py"
      - "scripts/tests/test_one_piece_coverage.py"
      - "scripts/reconcile_one_piece_fixed_foil_products.py"
      - "scripts/reconcile_one_piece_retail_printings.py"
      - "scripts/one_piece_eb05_retail.py"
      - "scripts/tests/test_one_piece_fixed_foil_products.py"
      - "scripts/tests/test_one_piece_retail_printings.py"
      - "publisher/one-piece/production/revision-2/fixed-foil-products.json"
      - "scripts/tests/test_one_piece_product_discovery.py"
      - "scripts/tests/test_one_piece_product_pipeline.py"
      - "scripts/tests/test_one_piece_tcgcsv_catalog.py"
      - "scripts/tests/test_normalize_one_piece_sources.py"
      - ".github/workflows/one-piece-catalog.yml"
      - "firebase.json"
      - "scripts/restore_catalog_hosting_site.sh"
      - "scripts/verify_pokemon_catalog_hosting_config.sh"
      - "scripts/tests/test_catalog_hosting_restore.py"
      - "scripts/prepare_one_piece_acceptance_samples.py"
      - "scripts/tests/test_one_piece_acceptance_samples.py"
  workflow_dispatch:
    inputs:
      audit:
        description: "Compare the signed catalog to the current official English card lists"
        type: boolean
        default: false
      sign:
        description: "Prepare a signed artifact (does not deploy)"
        type: boolean
        default: false
      candidate:
        description: "Reviewed canonical payload path in this repository"
        type: string
      reviewed_sha256:
        description: "SHA-256 of the exact reviewed payload bytes"
        type: string
      previous:
        description: "Previous verified envelope path; required after bootstrap"
        type: string
      bootstrap:
        description: "Explicit first publication at revision one"
        type: boolean
        default: false
      publish:
        description: "Publish an already signed One Piece artifact"
        type: boolean
        default: false
      signed_run_id:
        description: "Run ID that signed and verified the reviewed artifact"
        type: string
      reviewed_envelope_sha256:
        description: "SHA-256 of the reviewed signed envelope"
        type: string
      reviewed_manifest_sha256:
        description: "SHA-256 of the reviewed verified manifest"
        type: string

permissions:
  contents: read

jobs:
  coverage-report:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.audit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compare the verified catalog with Bandai's current inventory
        shell: bash
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/one-piece-coverage"
          mkdir -p "$audit"
          python3 - "$audit/current.json" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from market_price_feeds import ORIGIN, read_http

          data = read_http(f'{ORIGIN}/one-piece/v1/current.json', 48 * 1024 * 1024, absent_ok=True)
          if data is None:
              print('Hosted One Piece catalog returned 404. Auditing the bundled seed.')
              data = Path('TradingCardScanner/OnePieceCatalogSeed/one-piece-catalog-release.json').read_bytes()
          Path(sys.argv[1]).write_bytes(data)
          PY
          python3 scripts/one_piece_pinned_keys.py Config/OnePieceCatalogProduction.xcconfig "$audit/keys.json"
          swift run --package-path OnePieceCatalogCore one-piece-catalog-publisher verify-hosted-release \
            --input "$audit/current.json" --trusted-keys "$audit/keys.json"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_one_piece_coverage.py \
            --capture-root "$audit/source" --release "$audit/current.json" --output "$audit/coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: one-piece-official-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/one-piece-coverage/coverage.json
          if-no-files-found: error

  validate:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - name: Reject a combined sign and publish request
        if: github.event_name == 'workflow_dispatch' && inputs.sign && inputs.publish
        run: |
          echo "::error::Publish an artifact from a completed signing run."
          exit 1
      - uses: actions/checkout@v4
      - name: Validate hosting cache rules and namespace restoration
        run: |
          bash scripts/verify_pokemon_catalog_hosting_config.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_catalog_hosting_restore.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_hosting.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_acceptance_samples.py -v
      - name: Test bounded source normalization
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_normalize_one_piece_sources.py -v
      - name: Test retained TCGCSV capture and catalog builder
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_tcgcsv_catalog.py -v
      - name: Test reviewed product reconciliation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_product_pipeline.py -v
      - name: Test complete ordinary-product discovery
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_product_discovery.py -v
      - name: Test official coverage comparison and read-only discovery
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_coverage.py -v
      - name: Test fixed product finish evidence
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_fixed_foil_products.py -v
      - name: Test exact retailer finish and artwork comparison
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_retail_printings.py -v
      - name: Test exact base market mapping review
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_base_market_mappings.py -v
      - name: Test catalog core and publisher CLI
        run: swift test --package-path OnePieceCatalogCore
      - name: Test app trust anchor export
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_one_piece_pinned_keys.py -v

  sign-reviewed-artifact:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.sign == true && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: one-piece-catalog-signing
    env:
      KEY_ID: ${{ vars.ONE_PIECE_CATALOG_KEY_ID }}
      CANDIDATE: ${{ inputs.candidate }}
      REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
      PREVIOUS: ${{ inputs.previous }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and independently verify the reviewed envelope
        env:
          ONE_PIECE_CATALOG_SIGNING_KEY: ${{ secrets.ONE_PIECE_CATALOG_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_ID"
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path.cwd().resolve()
          for name in ("CANDIDATE", "PREVIOUS"):
              value = os.environ.get(name, "")
              if value:
                  path = pathlib.Path(value).resolve(strict=True)
                  path.relative_to(root)
                  if not path.is_file():
                      raise ValueError("Publication inputs must be repository files")
          PY
          artifact_root="$RUNNER_TEMP/one-piece-signed-artifact"
          mkdir -p "$artifact_root"
          trusted_keys="$RUNNER_TEMP/one-piece-app-pinned-keys.json"
          python3 scripts/one_piece_pinned_keys.py Config/OnePieceCatalogProduction.xcconfig "$trusted_keys"
          baseline=()
          if [ "$BOOTSTRAP" = true ]; then
            test -z "$PREVIOUS"
            baseline+=(--bootstrap-registry yes)
          else
            test -n "$PREVIOUS"
            baseline+=(--previous "$PREVIOUS")
          fi
          swift run --package-path OnePieceCatalogCore one-piece-catalog-publisher sign \
            --input "$CANDIDATE" --trusted-keys "$trusted_keys" --key-id "$KEY_ID" \
            --reviewed-payload-sha256 "$REVIEWED_SHA256" "${baseline[@]}" \
            --output "$artifact_root/release-envelope.json" --manifest "$artifact_root/manifest.json"
          swift run --skip-build --package-path OnePieceCatalogCore one-piece-catalog-publisher verify \
            --input "$artifact_root/release-envelope.json" --trusted-keys "$trusted_keys" \
            --reviewed-payload-sha256 "$REVIEWED_SHA256" "${baseline[@]}" \
            --manifest "$artifact_root/verified-manifest.json"
          cmp "$artifact_root/manifest.json" "$artifact_root/verified-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: one-piece-signed-artifact-${{ github.run_id }}
          path: ${{ runner.temp }}/one-piece-signed-artifact/
          if-no-files-found: error
          retention-days: 30

  publish-reviewed-artifact:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: one-piece-catalog-production
    concurrency:
      group: scanstash-catalog-production-hosting
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      HOSTING_ORIGIN: https://scanstash-catalog-prod.web.app
      SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
      REVIEWED_SHA256: ${{ inputs.reviewed_sha256 }}
      REVIEWED_ENVELOPE_SHA256: ${{ inputs.reviewed_envelope_sha256 }}
      REVIEWED_MANIFEST_SHA256: ${{ inputs.reviewed_manifest_sha256 }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the reviewed signing run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SIGNED_RUN_ID" =~ ^[0-9]+$ ]]
          for digest in "$REVIEWED_SHA256" "$REVIEWED_ENVELOPE_SHA256" "$REVIEWED_MANIFEST_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_RUN_ID" | jq -e '
            .path == ".github/workflows/one-piece-catalog.yml" and
            .head_branch == "main" and .event == "workflow_dispatch" and .conclusion == "success"
          '
      - uses: actions/download-artifact@v4
        with:
          name: one-piece-signed-artifact-${{ inputs.signed_run_id }}
          path: ${{ runner.temp }}/one-piece-reviewed-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signed_run_id }}
      - name: Verify the reviewed artifact against production and stage it
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/one-piece-reviewed-artifact"
          envelope="$artifact/release-envelope.json"
          printf '%s  %s\n' \
            "$REVIEWED_ENVELOPE_SHA256" "$envelope" \
            "$REVIEWED_MANIFEST_SHA256" "$artifact/verified-manifest.json" | shasum -a 256 -c -
          inputs="$RUNNER_TEMP/one-piece-hosting-inputs"
          revision=$(python3 scripts/prepare_one_piece_hosting.py --artifact "$artifact" \
            --output-dir "$inputs" --bootstrap "$BOOTSTRAP")
          if [ "$BOOTSTRAP" = true ]; then
            baseline=(--bootstrap-registry yes)
          else
            baseline=(--previous "$inputs/one-piece-predecessor.json")
          fi
          trusted_keys="$RUNNER_TEMP/one-piece-app-pinned-keys.json"
          python3 scripts/one_piece_pinned_keys.py Config/OnePieceCatalogProduction.xcconfig "$trusted_keys"
          swift run --package-path OnePieceCatalogCore one-piece-catalog-publisher verify \
            --input "$envelope" --trusted-keys "$trusted_keys" \
            --reviewed-payload-sha256 "$REVIEWED_SHA256" "${baseline[@]}" \
            --manifest "$RUNNER_TEMP/one-piece-verified-manifest.json"
          cmp "$RUNNER_TEMP/one-piece-verified-manifest.json" "$artifact/verified-manifest.json"
          bash scripts/restore_catalog_hosting_site.sh \
            "$inputs/pokemon-current.json" "$inputs/magic-current.json" publisher/site "$HOSTING_ORIGIN" \
            '' '' '' '' "$inputs/one-piece-current.json"
          destination=publisher/site/one-piece/v1
          immutable="$destination/releases/$revision/catalog-release.json"
          mkdir -p "$(dirname "$immutable")"
          if [ -f "$immutable" ]; then
            cmp "$envelope" "$immutable"
          else
            cp "$envelope" "$immutable"
          fi
          cp "$envelope" "$destination/current.json"
          bash scripts/verify_pokemon_catalog_hosting_config.sh
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@13.35.1
      - name: Deploy the preserved site to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE_ID: ${{ secrets.FIREBASE_HOSTING_SITE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          test "$FIREBASE_PROJECT_ID" = scanstash-catalog-prod
          test "$FIREBASE_HOSTING_SITE_ID" = scanstash-catalog-prod
          service_account_file="$(mktemp "$RUNNER_TEMP/firebase-one-piece-service-account.XXXXXX")"
          trap 'rm -f "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          firebase target:apply hosting production "$FIREBASE_HOSTING_SITE_ID" --project "$FIREBASE_PROJECT_ID"
          firebase deploy --only hosting:production --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Verify live catalog bytes and cache headers
        env:
          REVISION: ${{ steps.stage.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          readback="$RUNNER_TEMP/one-piece-hosting-readback"
          headers="$RUNNER_TEMP/one-piece-hosting-headers"
          for origin in "$HOSTING_ORIGIN" https://catalog.scan-stash.com; do
            for path in one-piece/v1/current.json "one-piece/v1/releases/$REVISION/catalog-release.json" \
              v1/current.json magic/v1/current.json yugioh/v1/current.json market-prices/v1/index.json; do
              expected="publisher/site/$path"
              if [ ! -f "$expected" ]; then continue; fi
              curl --fail --silent --show-error --retry 3 --max-time 60 \
                --dump-header "$headers" --output "$readback" \
                "$origin/$path?publication_check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              cmp "$expected" "$readback"
              case "$path" in
                one-piece/v1/current.json) grep -qi '^cache-control:.*no-cache' "$headers" ;;
                one-piece/v1/releases/*)
                  grep -qi '^cache-control:.*max-age=31536000' "$headers"
                  grep -qi '^cache-control:.*immutable' "$headers" ;;
              esac
              printf 'Verified %s/%s\n' "$origin" "$path"
            done
          done
